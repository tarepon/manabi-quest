<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 外部への通信・外部リソース読み込みを全面禁止（このアプリは端末内で完結する） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>まなびクエスト 中1 — 科学的ゲーミング学習</title>
<style>
  :root{
    --bg:#0f1425; --panel:#1a2138; --panel2:#222b4a; --line:#2e3a63;
    --text:#eef1fb; --sub:#9aa5c9;
    --math:#4f8ef7; --eng:#f75f6d; --jpn:#f7a44f; --sci:#3ecf8e; --soc:#b48ef7;
    --gold:#ffd166; --ok:#3ecf8e; --ng:#f75f6d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:radial-gradient(1200px 600px at 50% -100px,#1b2445,var(--bg));
    color:var(--text); min-height:100vh;
  }
  #app{max-width:540px;margin:0 auto;padding:16px 16px 120px;}
  h1{font-size:22px} h2{font-size:18px;margin-bottom:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .grow{flex:1}
  .sub{color:var(--sub);font-size:13px;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  button{
    font-family:inherit;border:none;border-radius:14px;cursor:pointer;
    font-size:16px;font-weight:700;color:var(--text);
  }
  .btn-main{
    width:100%;padding:16px;background:linear-gradient(135deg,#5b7cfa,#8a5bfa);
    box-shadow:0 6px 20px rgba(90,110,250,.35);margin-top:6px;
  }
  .btn-main:active{transform:scale(.98)}
  .btn-sub{width:100%;padding:13px;background:var(--panel2);border:1px solid var(--line);margin-top:8px;}
  .btn-ghost{background:none;color:var(--sub);font-size:14px;padding:8px;font-weight:600}
  /* XP bar */
  .xpbar{height:12px;background:#0c1020;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .xpbar>div{height:100%;background:linear-gradient(90deg,#ffd166,#ff9f43);transition:width .5s}
  .masterybar{height:8px;background:#0c1020;border-radius:99px;overflow:hidden}
  .masterybar>div{height:100%;transition:width .5s}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
  /* quiz */
  .qtext{font-size:19px;font-weight:700;line-height:1.7;margin:14px 0 18px}
  .choice{
    display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;
    background:var(--panel2);border:2px solid var(--line);border-radius:14px;
    font-size:16px;font-weight:600;line-height:1.5;
  }
  .choice:active{transform:scale(.99)}
  .choice.correct{border-color:var(--ok);background:rgba(62,207,142,.15)}
  .choice.wrong{border-color:var(--ng);background:rgba(247,95,109,.15)}
  .choice.dim{opacity:.45}
  .feedback{border-radius:14px;padding:14px;margin-top:6px;font-size:14px;line-height:1.7;animation:pop .25s}
  .feedback.ok{background:rgba(62,207,142,.12);border:1px solid var(--ok)}
  .feedback.ng{background:rgba(247,95,109,.12);border:1px solid var(--ng)}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .progress{height:10px;background:#0c1020;border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .progress>div{height:100%;background:linear-gradient(90deg,#3ecf8e,#4f8ef7);transition:width .3s}
  /* nav */
  nav{
    position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,37,.95);
    border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:10;
  }
  nav .inner{max-width:540px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;padding:10px 4px 14px;font-size:11px;color:var(--sub);font-weight:600}
  nav button.active{color:var(--gold)}
  nav .ico{display:block;font-size:20px;margin-bottom:2px}
  .badge{
    display:flex;gap:12px;align-items:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;
  }
  .badge.locked{opacity:.4;filter:grayscale(1)}
  .badge .bemoji{font-size:30px}
  .unit-btn{
    display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;margin-bottom:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;text-align:left;font-size:15px;
  }
  .streak-flame{font-size:34px;filter:drop-shadow(0 0 8px rgba(255,160,60,.6))}
  .science h3{font-size:15px;margin:16px 0 6px;color:var(--gold)}
  .science p{font-size:14px;line-height:1.8;color:#cdd5ef}
  .science cite{display:block;font-size:12px;color:var(--sub);margin-top:4px;font-style:normal}
  .result-emoji{font-size:56px;text-align:center;margin:10px 0}
  .stat3{display:flex;text-align:center;margin:14px 0}
  .stat3>div{flex:1}
  .stat3 .v{font-size:22px;font-weight:800}
  .stat3 .k{font-size:12px;color:var(--sub)}
  .duechip{font-size:12px;color:var(--sub)}
  .center{text-align:center}
  a{color:#8fb3ff}
  /* battle */
  .hpbar{height:14px;background:#0c1020;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .hpbar>div{height:100%;background:linear-gradient(90deg,#3ecf8e,#9be15d);transition:width .4s}
  .hpbar>div.low{background:linear-gradient(90deg,#ffd166,#f7a44f)}
  .hpbar>div.danger{background:linear-gradient(90deg,#f75f6d,#ff8fa0)}
  .monster-emoji{font-size:64px;text-align:center;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));transition:opacity .5s,filter .5s}
  .monster-emoji.fainted{opacity:.25;filter:grayscale(1)}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .hit{animation:shakeX .4s}
  .battle-line{font-size:13px;color:var(--sub);text-align:center;margin:6px 0;line-height:1.6}
  .combo-chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;
    background:linear-gradient(135deg,#ffd166,#ff9f43);color:#33230a}
  .monster-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:14px;text-align:left;font-size:15px}
  .monster-row .memoji{font-size:32px}
  .monster-row.beaten .memoji{filter:grayscale(.4)}
  .monster-row.locked{opacity:.45;filter:grayscale(1)}
  .monster-row.secret{border-color:#c026d3;background:linear-gradient(135deg,rgba(192,38,211,.16),rgba(139,92,246,.16));box-shadow:0 0 14px rgba(192,38,211,.3)}
  .hpbar.secret-hp{border-color:#c026d3;box-shadow:0 0 10px rgba(192,38,211,.4)}
  .hpbar.secret-hp>div{background:linear-gradient(90deg,#c026d3,#f75f6d)}
  /* 特訓：切り替えタブ・修行の部屋 */
  .segrow{display:flex;gap:8px;margin-bottom:14px}
  .segbtn{flex:1;padding:11px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--sub);font-weight:700}
  .segbtn.active{background:linear-gradient(135deg,#5b7cfa,#8a5bfa);color:#fff;border-color:transparent}
  .ans-input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;font-weight:800;margin-bottom:10px;text-align:center}
  .ans-input:focus{outline:none;border-color:#5b7cfa}
  .ans-input.correct{border-color:var(--ok);background:rgba(62,207,142,.15)}
  .ans-input.wrong{border-color:var(--ng);background:rgba(247,95,109,.15)}
  .dojo-card{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:8px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;text-align:left}
  .dojo-card .dico{font-size:28px}
  .lockcount{font-size:13px;color:var(--sub);text-align:center;padding:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="inner" id="nav"></div></nav>

<script>
"use strict";
/* =====================================================================
   まなびクエスト 中1
   根拠のある学習メカニズム:
   - 間隔反復 (Ebbinghaus 1885; Cepeda et al. 2006)
   - 検索練習・テスト効果 (Roediger & Karpicke 2006)
   - 即時フィードバック (Hattie & Timperley 2007)
   - インターリービング (Rohrer & Taylor 2007)
   - 習慣化・動機づけ (Deci & Ryan; Hamari et al. 2014)
   ===================================================================== */

const SUBJECTS = {
  math:{name:"数学", emoji:"🧮", color:"var(--math)"},
  eng :{name:"英語", emoji:"🗣️", color:"var(--eng)"},
  jpn :{name:"国語", emoji:"📖", color:"var(--jpn)"},
  sci :{name:"理科", emoji:"🔬", color:"var(--sci)"},
  soc :{name:"社会", emoji:"🌏", color:"var(--soc)"},
};

/* 問題バンク: c[0]が正解（表示時にシャッフル） */
const BANK = [
/* ===== 数学・正負の数 ===== */
{s:"math",u:"正負の数",q:"(−3)+(−5) を計算すると？",c:["−8","−2","8","2"],e:"同符号の2数の和は、絶対値の和に共通の符号をつけます。3+5=8 で符号は−。"},
{s:"math",u:"正負の数",q:"4−(−6) を計算すると？",c:["10","−2","2","−10"],e:"−(−6) は +6 に直せます。4+6=10。"},
{s:"math",u:"正負の数",q:"(−2)×(−7) を計算すると？",c:["14","−14","9","−9"],e:"負×負＝正。2×7=14。"},
{s:"math",u:"正負の数",q:"(−12)÷4 を計算すると？",c:["−3","3","−8","8"],e:"負÷正＝負。12÷4=3 で符号は−。"},
{s:"math",u:"正負の数",q:"−5 の絶対値は？",c:["5","−5","0","1/5"],e:"絶対値は数直線上での0からの距離。符号を取った値になります。"},
{s:"math",u:"正負の数",q:"(−3)² を計算すると？",c:["9","−9","6","−6"],e:"(−3)×(−3)=9。負の数を偶数回かけると正になります。"},
{s:"math",u:"正負の数",q:"−3² を計算すると？",c:["−9","9","−6","6"],e:"−3² は「3² にマイナスをつけたもの」なので −9。(−3)² との違いに注意！"},
/* ===== 数学・文字と式 ===== */
{s:"math",u:"文字と式",q:"a×b÷c を文字式のきまりにしたがって表すと？",c:["ab/c","abc","a+b−c","c/ab"],e:"×は省略し、÷は分数の形で表します。"},
{s:"math",u:"文字と式",q:"x+x+x を簡単にすると？",c:["3x","x³","3+x","x/3"],e:"同じ文字の和は係数をまとめます。x が3つで 3x。x³（かけ算）と混同しないように。"},
{s:"math",u:"文字と式",q:"3(2x−4) を計算すると？",c:["6x−12","6x−4","5x−7","6x+12"],e:"分配法則。3×2x=6x、3×(−4)=−12。"},
{s:"math",u:"文字と式",q:"5a−2a を計算すると？",c:["3a","3","7a","3a²"],e:"同じ文字の項は係数どうしを計算。5−2=3 なので 3a。"},
{s:"math",u:"文字と式",q:"1個x円のりんごを3個買い、100円の箱に入れてもらった代金は？",c:["3x+100（円）","3x−100（円）","x+300（円）","103x（円）"],e:"りんご3個で 3x 円。それに箱の100円を足します。"},
{s:"math",u:"文字と式",q:"x=−2 のとき、3x+5 の値は？",c:["−1","11","1","−11"],e:"3×(−2)+5=−6+5=−1。負の数はかっこをつけて代入しましょう。"},
/* ===== 数学・一次方程式 ===== */
{s:"math",u:"一次方程式",q:"方程式 x+7=12 の解は？",c:["x=5","x=19","x=−5","x=7"],e:"7を右辺に移項して x=12−7=5。"},
{s:"math",u:"一次方程式",q:"方程式 3x=−15 の解は？",c:["x=−5","x=5","x=−45","x=−12"],e:"両辺を3でわって x=−5。"},
{s:"math",u:"一次方程式",q:"方程式 2x−3=7 の解は？",c:["x=5","x=2","x=−5","x=10"],e:"−3を移項して 2x=10、両辺を2でわって x=5。"},
{s:"math",u:"一次方程式",q:"方程式 5x+2=3x+10 の解は？",c:["x=4","x=6","x=−4","x=2"],e:"文字を左へ、数を右へ移項。2x=8 なので x=4。"},
{s:"math",u:"一次方程式",q:"方程式 x/3=6 の解は？",c:["x=18","x=2","x=3","x=9"],e:"両辺に3をかけて x=18。"},
{s:"math",u:"一次方程式",q:"比例式 x:6=2:3 の x の値は？",c:["x=4","x=9","x=3","x=12"],e:"a:b=c:d のとき ad=bc。3x=12 なので x=4。"},
/* ===== 数学・比例と反比例 ===== */
{s:"math",u:"比例と反比例",q:"y=3x で x=4 のとき y の値は？",c:["12","7","1","81"],e:"x の値を代入するだけ。3×4=12。"},
{s:"math",u:"比例と反比例",q:"y=−2x の比例定数は？",c:["−2","2","x","−2x"],e:"y=ax の a が比例定数です。"},
{s:"math",u:"比例と反比例",q:"反比例 y=12/x で x=3 のとき y の値は？",c:["4","36","9","1/4"],e:"12÷3=4。反比例では x×y が一定（ここでは12）です。"},
{s:"math",u:"比例と反比例",q:"比例 y=ax のグラフの特徴は？",c:["原点を通る直線","原点を通らない直線","双曲線","放物線"],e:"比例のグラフは必ず原点(0,0)を通る直線になります。"},
{s:"math",u:"比例と反比例",q:"y が x に反比例し、x=2 のとき y=9。式は？",c:["y=18/x","y=9/x","y=4.5x","y=11−x"],e:"y=a/x に代入すると a=xy=2×9=18。"},
{s:"math",u:"比例と反比例",q:"点 (3, −2) は第何象限にある？",c:["第四象限","第一象限","第二象限","第三象限"],e:"x が正、y が負の領域は第四象限（右下）です。"},
/* ===== 数学・平面図形 ===== */
{s:"math",u:"平面図形",q:"半径6cmの円の面積は？（円周率はπ）",c:["36π cm²","12π cm²","6π cm²","18π cm²"],e:"円の面積＝πr²。π×6²=36π。"},
{s:"math",u:"平面図形",q:"半径3cmの円の周の長さは？",c:["6π cm","9π cm","3π cm","12π cm"],e:"円周＝2πr。2×π×3=6π。"},
{s:"math",u:"平面図形",q:"半径6cm・中心角60°のおうぎ形の弧の長さは？",c:["2π cm","6π cm","π cm","12π cm"],e:"円周12πの 60/360＝1/6 なので 2π cm。"},
{s:"math",u:"平面図形",q:"線分ABの垂直二等分線上の点の性質は？",c:["2点A, Bから等しい距離にある","線分ABと平行","つねにABより長い","Aだけに近い"],e:"垂直二等分線＝2点から等距離にある点の集まり。作図問題の考え方の基本です。"},
{s:"math",u:"平面図形",q:"図形を180°回転させる移動を何という？",c:["点対称移動","平行移動","対称移動（線対称）","拡大"],e:"回転移動のうち180°回転を点対称移動といいます。"},
{s:"math",u:"平面図形",q:"角の二等分線上の点の性質は？",c:["角の2辺から等しい距離にある","頂点から最も遠い","2辺と垂直に交わる","円の中心になる"],e:"角の二等分線＝2辺から等距離にある点の集まりです。"},
/* ===== 数学・空間図形 ===== */
{s:"math",u:"空間図形",q:"底面の半径3cm・高さ5cmの円柱の体積は？",c:["45π cm³","15π cm³","30π cm³","9π cm³"],e:"円柱の体積＝底面積×高さ＝9π×5=45π。"},
{s:"math",u:"空間図形",q:"角錐・円錐の体積は、底面と高さが同じ角柱・円柱の何倍？",c:["1/3倍","1/2倍","2/3倍","1/4倍"],e:"錐（すい）の体積は柱の 1/3。V＝(1/3)×底面積×高さ。"},
{s:"math",u:"空間図形",q:"正多面体は全部で何種類ある？",c:["5種類","4種類","6種類","8種類"],e:"正四面体・正六面体・正八面体・正十二面体・正二十面体の5種類だけです。"},
{s:"math",u:"空間図形",q:"円錐の展開図で、側面はどんな形？",c:["おうぎ形","円","三角形","長方形"],e:"円錐の側面を開くとおうぎ形になります（円柱なら長方形）。"},
{s:"math",u:"空間図形",q:"半径 r の球の表面積は？",c:["4πr²","πr²","2πr²","(4/3)πr³"],e:"球の表面積＝4πr²。(4/3)πr³ は体積の公式です。"},
{s:"math",u:"空間図形",q:"空間内で、交わらず平行でもない2直線の関係を何という？",c:["ねじれの位置","垂直","一致","接する"],e:"同じ平面上にない2直線は「ねじれの位置」にあるといいます。"},
/* ===== 数学・データの活用 ===== */
{s:"math",u:"データの活用",q:"データ 3, 5, 7, 9, 11 の中央値は？",c:["7","5","9","35"],e:"小さい順に並べたときの真ん中の値。5個なら3番目の7です。"},
{s:"math",u:"データの活用",q:"度数分布表で、階級の真ん中の値を何という？",c:["階級値","度数","相対度数","中央値"],e:"例：10〜20の階級なら階級値は15です。"},
{s:"math",u:"データの活用",q:"相対度数の求め方は？",c:["その階級の度数 ÷ 度数の合計","度数の合計 ÷ その階級の度数","最大値 − 最小値","度数 × 階級値"],e:"全体に対する割合を表すのが相対度数です。"},
{s:"math",u:"データの活用",q:"データの範囲（レンジ）の求め方は？",c:["最大値 − 最小値","最大値 + 最小値","平均値 − 中央値","度数の合計"],e:"データの散らばりの大きさを表す最も簡単な指標です。"},
{s:"math",u:"データの活用",q:"データの中で最も多く出てくる値を何という？",c:["最頻値（モード）","中央値（メジアン）","平均値","階級値"],e:"最頻値＝モード。度数が最大の値です。"},
/* ===== 英語・be動詞 ===== */
{s:"eng",u:"be動詞",q:"I ___ a student.",c:["am","is","are","be"],e:"主語が I のとき be動詞は am。"},
{s:"eng",u:"be動詞",q:"You ___ kind.",c:["are","am","is","be"],e:"主語が you のとき be動詞は are。"},
{s:"eng",u:"be動詞",q:"This ___ my book.",c:["is","am","are","do"],e:"this / he / she / it など単数（I, you以外）は is。"},
{s:"eng",u:"be動詞",q:"___ you from Osaka?",c:["Are","Is","Am","Do"],e:"be動詞の疑問文は be動詞を文の先頭に。You are → Are you?"},
{s:"eng",u:"be動詞",q:"「is not」の短縮形は？",c:["isn't","aren't","don't","not's"],e:"is not → isn't。are not → aren't も一緒に覚えましょう。"},
{s:"eng",u:"be動詞",q:"Ken and I ___ good friends.",c:["are","is","am","be"],e:"Ken and I ＝ we（複数）なので are。"},
/* ===== 英語・一般動詞（基本） ===== */
{s:"eng",u:"一般動詞（基本）",q:"I ___ soccer every day.",c:["play","plays","playing","am play"],e:"主語が I なので動詞はそのままの形（原形）。"},
{s:"eng",u:"一般動詞（基本）",q:"___ you like dogs? — Yes, I do.",c:["Do","Are","Does","Is"],e:"一般動詞（like）の疑問文は Do で始めます。be動詞と混ぜないのがコツ。"},
{s:"eng",u:"一般動詞（基本）",q:"I ___ not play the piano.",c:["do","am","does","is"],e:"一般動詞の否定文は do not（don't）＋動詞の原形。"},
{s:"eng",u:"一般動詞（基本）",q:"「私は毎日英語を勉強します」＝ I ___ English every day.",c:["study","am study","studies","studying"],e:"主語が I の一般動詞はそのまま（原形）。be動詞はいりません。"},
/* ===== 英語・三単現（3人称単数） ===== */
{s:"eng",u:"三単現（3人称単数）",q:"She ___ TV after dinner.",c:["watches","watch","watching","is watch"],e:"三人称単数・現在なので watches。語尾が ch の動詞は es をつけます。"},
{s:"eng",u:"三単現（3人称単数）",q:"___ he like music?",c:["Does","Do","Is","Are"],e:"一般動詞の疑問文で主語が三人称単数なら Does。動詞は原形 like に戻します。"},
{s:"eng",u:"三単現（3人称単数）",q:"My brother ___ a dog.",c:["has","have","haves","is"],e:"have の三単現は has。特別な変化なので要注意！"},
{s:"eng",u:"三単現（3人称単数）",q:"He doesn't ___ natto.",c:["eat","eats","eating","ate"],e:"doesn't（does not）の後ろの動詞は必ず原形です。"},
{s:"eng",u:"三単現（3人称単数）",q:"study の三単現（三人称単数・現在形）は？",c:["studies","studys","studyes","studied"],e:"〈子音字＋y〉で終わる動詞は y を i に変えて es。"},
/* ===== 英語・疑問詞 ===== */

{s:"eng",u:"疑問詞",q:"___ do you get up? — At six.",c:["What time","Where","Who","Whose"],e:"「何時に？」は What time。At six（6時に）と時刻を答えています。"},
{s:"eng",u:"疑問詞",q:"___ is your bag? — It's under the desk.",c:["Where","When","Who","Why"],e:"場所を答えているので「どこ？」＝ Where。"},
{s:"eng",u:"疑問詞",q:"___ do you like better, summer or winter?",c:["Which","What","Who","How"],e:"選択肢の中から「どちら？」と選ばせるときは Which。"},
{s:"eng",u:"疑問詞",q:"___ old is your school?",c:["How","What","When","Which"],e:"How old（どのくらい古い＝築何年/何歳）。How many, How much も同じ仲間。"},
{s:"eng",u:"疑問詞",q:"___ bag is this? — It's Yumi's.",c:["Whose","Who","Which","What"],e:"「だれの〜？」は Whose。Yumi's（ユミのもの）と答えています。"},
/* ===== 英語・命令文とcan ===== */
{s:"eng",u:"命令文とcan",q:"___ quiet in the library.",c:["Be","Do","Are","Being"],e:"be動詞の命令文は Be で始めます。"},
{s:"eng",u:"命令文とcan",q:"___ run in the classroom.（走ってはいけません）",c:["Don't","Not","Doesn't","Can't"],e:"禁止の命令文は Don't ＋動詞の原形。"},
{s:"eng",u:"命令文とcan",q:"She can ___ very fast.",c:["run","runs","running","ran"],e:"can などの助動詞の後ろは動詞の原形。主語が she でも runs にはなりません。"},
{s:"eng",u:"命令文とcan",q:"Can I use your pen? の意味は？",c:["あなたのペンを使ってもいいですか","あなたのペンを使ってくれますか","私のペンを使いますか","ペンを使えません"],e:"Can I 〜? は「〜してもいいですか」と許可を求める表現です。"},
{s:"eng",u:"命令文とcan",q:"Let's play tennis. — Yes, ___.",c:["let's","we do","I can","please"],e:"Let's 〜. への応じ方は Yes, let's. / No, let's not."},
{s:"eng",u:"命令文とcan",q:"___ you help me?（手伝ってくれますか）",c:["Can","Are","Am","Let's"],e:"Can you 〜? は「〜してくれますか」と依頼する表現です。"},
/* ===== 英語・現在進行形 ===== */
{s:"eng",u:"現在進行形",q:"I ___ watching TV now.",c:["am","is","are","do"],e:"現在進行形は〈be動詞＋動詞のing形〉。主語 I なので am。"},
{s:"eng",u:"現在進行形",q:"run の ing形は？",c:["running","runing","runs","ran"],e:"〈短母音＋子音字〉で終わる動詞は最後の文字を重ねて ing。"},
{s:"eng",u:"現在進行形",q:"He is ___ lunch now.",c:["eating","eat","eats","ate"],e:"be動詞の後ろは動詞のing形。「今食べているところ」を表します。"},
{s:"eng",u:"現在進行形",q:"___ she studying now?",c:["Is","Does","Do","Are"],e:"進行形の疑問文は be動詞を先頭に。She is studying → Is she studying?"},
{s:"eng",u:"現在進行形",q:"write の ing形は？",c:["writing","writeing","writting","wrote"],e:"e で終わる動詞は e をとって ing。"},
{s:"eng",u:"現在進行形",q:"現在進行形の形として正しいのは？",c:["be動詞＋動詞のing形","do＋動詞の原形","be動詞＋動詞の原形","have＋過去分詞"],e:"「今〜しているところ」＝〈am/is/are＋〜ing〉です。"},
/* ===== 英語・過去形 ===== */
{s:"eng",u:"過去形",q:"I ___ tennis yesterday.",c:["played","play","plays","playing"],e:"yesterday（昨日）があるので過去形 played。"},
{s:"eng",u:"過去形",q:"go の過去形は？",c:["went","goed","gone","goes"],e:"go は不規則動詞。go−went−gone。"},
{s:"eng",u:"過去形",q:"___ you busy yesterday?",c:["Were","Was","Did","Are"],e:"be動詞の過去の疑問文。主語 you なので were。"},
{s:"eng",u:"過去形",q:"Did you ___ the movie?",c:["see","saw","seen","sees"],e:"Did を使った疑問文では動詞は原形に戻します。"},
{s:"eng",u:"過去形",q:"study の過去形は？",c:["studied","studyed","studed","studies"],e:"〈子音字＋y〉は y を i に変えて ed。"},
{s:"eng",u:"過去形",q:"She ___ to Kyoto last month.",c:["went","goes","go","going"],e:"last month（先月）があるので過去形。go の過去形は went。"},
/* ===== 英語・名詞と代名詞 ===== */
{s:"eng",u:"名詞と代名詞",q:"box の複数形は？",c:["boxes","boxs","boxies","box"],e:"s, x, ch, sh で終わる名詞は es をつけます。"},
{s:"eng",u:"名詞と代名詞",q:"child の複数形は？",c:["children","childs","childes","childrens"],e:"child は不規則変化。man→men, woman→women も一緒に。"},
{s:"eng",u:"名詞と代名詞",q:"「彼女を」を表す語は？",c:["her","she","hers","he"],e:"she（〜は）− her（〜の）− her（〜を）− hers（〜のもの）。目的格は her。"},
{s:"eng",u:"名詞と代名詞",q:"「彼らのもの」を表す語は？",c:["theirs","their","them","they"],e:"they − their − them − theirs。「〜のもの」は theirs。"},
{s:"eng",u:"名詞と代名詞",q:"This is ___ pen.（私のペン）",c:["my","I","me","mine"],e:"名詞の前につく「〜の」は所有格 my。"},
{s:"eng",u:"名詞と代名詞",q:"I know ___.（私は彼を知っている）",c:["him","he","his","her"],e:"動詞の目的語になる「彼を」は目的格 him。"},
/* ===== 国語・漢字の読み ===== */

{s:"jpn",u:"漢字の読み",q:"「頻繁」の読み方は？",c:["ひんぱん","びんかん","ひんど","はんざつ"],e:"頻繁＝しきりに行われること。"},
{s:"jpn",u:"漢字の読み",q:"「委ねる」の読み方は？",c:["ゆだねる","たずねる","かさねる","つらねる"],e:"委ねる＝すべてまかせること。「委任」の委です。"},

/* ============ 学習進度（中1・前期後期制の標準カリキュラム連動） ============ */

   標準的な検定教科書の年間指導計画をもとにした目安。
   まだ習っていない単元は今日のクエストに出ず、特訓で「先取り」だけできる。 */
const CURRICULUM = {
  "math|正負の数":1, "math|文字と式":3, "math|一次方程式":6, "math|比例と反比例":7,
  "math|平面図形":9, "math|空間図形":10, "math|データの活用":11,
  "eng|be動詞":1, "eng|一般動詞（基本）":2, "eng|疑問詞":3, "eng|命令文とcan":4,
  "eng|名詞と代名詞":6, "eng|三単現（3人称単数）":7, "eng|現在進行形":9, "eng|過去形":10,
  "jpn|漢字の読み":1, "jpn|漢字の書き":1, "jpn|文法":2, "jpn|語彙とことわざ":1,
  "sci|植物の世界":1, "sci|身のまわりの物質":6, "sci|光・音・力":9, "sci|大地の変化":11,

};
function schoolMonth(){ return ((new Date().getMonth()+1) - 4 + 12) % 12 + 1; } // 4月=1
function termName(){ return schoolMonth() <= 6 ? "前期" : "後期"; }
function monthLabel(sm){ return ((sm+2)%12+1) + "月"; }
function unitUnlocked(s,u){ const sm = CURRICULUM[s+"|"+u]; return sm===undefined || sm <= schoolMonth(); }

/* ============ バトルモード（ポケモン風・手持ちモンスターバトル） ============ */

   タイプ相性で技の通りやすさが変わり、通常モンスターは倒すとなかまにできる。
   バトル中の解答もふつうのクエストと同じく復習スケジュールに記録される。 */

/* 100体構成：9種のふつうモンスター×10段階（ウェーブ）＋各ウェーブ末尾のウェーブボス10体＝100体。
   段階が進むほどHP・こうげき力が上がり、弱点教科も5教科を均等に巡回する。 */
const MONSTER_SPECIES = [
  {emoji:"🐛", base:"ワスレムシ",       weak:"math", line:"「ならったこと、もうわすれちゃった？」"},
  {emoji:"👻", base:"サボリーヌ",       weak:"eng",  line:"「きょうくらい、サボっちゃえば〜？」"},
  {emoji:"🍄", base:"ネムネムダケ",     weak:"jpn",  line:"「ねむい…きみもねむくなーれ…」"},
  {emoji:"🐺", base:"ケアレスウルフ",   weak:"sci",  line:"「おっと、うっかりミスをねらうぜ！」"},

  {emoji:"🦉", base:"ヨフカシフクロウ", weak:"sci",  line:"「夜ふかしすれば記憶は消えるホゥ」"},

];
/* ============ タイプ相性（5教科を五角形の相性表に）============
   math→sci→soc→eng→jpn→math の順に「一つ先のタイプに強い」。
   例：数学タイプの技は理科タイプの相手に1.5倍、逆に理科タイプは数学タイプに0.6倍しか通らない。
   2つ離れたタイプ同士は無関係（等倍）。 */
const TYPE_ORDER = ["math","sci","soc","eng","jpn"];
function nextType(t){ const i = TYPE_ORDER.indexOf(t); return i<0 ? null : TYPE_ORDER[(i+1)%TYPE_ORDER.length]; }
function typeFromWeak(weak){ return weak ? nextType(weak) : null; } // 旧「弱点教科」から、そのモンスター自身のタイプを逆算する
function typeMultiplier(atkType, defType){
  if(!atkType || !defType) return 1;
  const ai = TYPE_ORDER.indexOf(atkType), di = TYPE_ORDER.indexOf(defType);
  const diff = (di - ai + TYPE_ORDER.length) % TYPE_ORDER.length;
  if(diff===1) return 1.5; // atkTypeがdefTypeに強い
  if(diff===TYPE_ORDER.length-1) return 0.6; // defTypeがatkTypeに強い（あまり通らない）
  return 1;
}
/* 教科タイプに対応する「技」。手持ちモンスターは自分のタイプの技＋そのタイプが得意とする技の2つを覚える。 */
const MOVES = {
  math:{type:"math", name:"ロジックパンチ",       emoji:"🧮"},
  sci: {type:"sci",  name:"げんりレーザー",       emoji:"🔬"},
  soc: {type:"soc",  name:"れきしのいかり",       emoji:"🌏"},
  eng: {type:"eng",  name:"ボキャブラリービーム", emoji:"🗣️"},
  jpn: {type:"jpn",  name:"ことだまアタック",     emoji:"📖"},
};
function movesForType(type){
  if(!type) return [MOVES.jpn, MOVES.math];
  return [MOVES[type], MOVES[nextType(type)]];
}
/* なかまにしたときの名前（前向きな姿へ進化する）。野生時の階級プレフィックスは外れる。 */
const CAPTURE_NAME = {

const TIER_PREFIX = ["ちび","","げんきな","すばやい","したたかな","じゅくれんの","きょうぼうな","でんせつの","こんじょうの","おうごんの"];
const WAVE_BOSSES = [

  {emoji:"👻", name:"三日坊主デーモン",     weak:"eng",  line:"「どうせ三日で終わるんだろ？」"},

  {emoji:"🗿", name:"暗記拒否ゴーレム",     weak:"sci",  line:"「おぼえるのは　めんどうだ」"},
  {emoji:"😴", name:"睡魔将軍",             weak:"soc",  line:"「さあ、いっしょに　ねむろう」"},
  {emoji:"🐗", name:"油断のあらくれ",       weak:"math", line:"「かんぺきだと思った時が、いちばんあぶない」"},
  {emoji:"📱", name:"スマホの誘惑魔",       weak:"eng",  line:"「あと5分だけ…って言ったよね？」"},
  {emoji:"🐉", name:"一夜漬けドラゴン",     weak:"jpn",  line:"「前日にまとめてやれば、なんとかなる！」"},
  {emoji:"🦇", name:"スランプの魔王",       weak:"sci",  line:"「がんばっても、のびない…そう思わせてやる」"},
  {emoji:"👑", name:"ボウキャクキング",     weak:null,   line:"「すべての記憶を忘却の彼方へ！」"},
];
function buildMonsters(){
  const arr = [];
  for(let wave=0; wave<10; wave++){
    for(let i=0;i<MONSTER_SPECIES.length;i++){
      const sp = MONSTER_SPECIES[i];
      const k = arr.length; // 0-indexed の全体通し番号
      arr.push({
        emoji: sp.emoji,
        name: TIER_PREFIX[wave] + sp.base,
        lv: k+1,
        hp: 35 + Math.round(k*1.3),
        atk: 6 + Math.floor(k/12),
        weak: sp.weak,
        type: typeFromWeak(sp.weak),
        line: sp.line,
        speciesBase: sp.base, // なかまにしたときの名前引きに使う（階級プレフィックスを除いた元の種族名）
        capturable: true,
      });
    }
    const boss = WAVE_BOSSES[wave];
    const k = arr.length;
    arr.push({
      emoji: boss.emoji,
      name: boss.name,
      lv: k+1,
      hp: 55 + Math.round(k*1.6),
      atk: 8 + Math.floor(k/10),
      weak: boss.weak,
      type: typeFromWeak(boss.weak),
      line: boss.line,
      capturable: false, // ウェーブボスはなかまにできない（毎ウェーブの節目のガチ勝負）
    });
  }
  return arr;
}

    line:"「あと5分…が、えいえんに つづく」"},
  {emoji:"💀", name:"真・ボウキャクキング",      weak:null, type:null, lv:220, hp:600, atk:28, secret:true, capturable:false,
    line:"「わすれることこそ、げんじつだ」"},

/* ============ 修行の部屋（基礎ドリル）============
   二桁の計算・九九・漢字の読みなど「直感で答えるべき、暗記メインの問題」を
   入力式でくり返し練習するコーナー。計算問題はその場で計算して出題するため、
   問題と答えが必ず一致する（人が書き写す余地がなく、誤りが起こらない）。
   漢字の読みは読み方が一意に定まる語のみを採用し、すべて複数回確認済み。 */

function makeCalcProblem(cat){

    return {q:`${a} ＋ ${b} ＝ ？`, ans:String(a+b)};
  }

const STARTER_TEMPLATE = {emoji:"🐥", name:"マナビー", type:"jpn", speciesBase:"マナビー"};
function makeMonsterInstance(o){
  S.nextMonsterId = (S.nextMonsterId||0) + 1;

}
function monsterLevel(inst){ return 1 + Math.floor(inst.xp/15); }
function monsterMaxHp(inst){ return 22 + monsterLevel(inst)*4 + inst.iv.hp; }
function monsterAtk(inst){ return 5 + Math.floor(monsterLevel(inst)*0.8) + Math.floor(inst.iv.atk/3); }

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function itemState(id){ return S.items[id]; }
function dueIds(){
  const now = Date.now();
  return Object.keys(S.items).filter(id => S.items[id].due <= now).map(Number);
}
function newUnlockedIds(){
  // 新しい問題は「もう習った単元」だけから出す（予約済みの復習は単元にかかわらず出る）
  return BANK.map((_,i)=>i).filter(i => !S.items[i] && unitUnlocked(BANK[i].s, BANK[i].u));
}
function scheduleAnswer(id, firstTryCorrect, retried){
  let st = S.items[id];
  const isNew = !st;
  if(!st){ st = S.items[id] = {stage:0, due:0, seen:0, right:0, wrong:0}; }
  // 「特訓」「バトル」はまだ復習日が来ていない問題も出題できるため、その前倒し分は
  // 間隔（ステージ）を進めない＝マスター判定を早送りしない。新規問題や、実際に復習日が来ていた
  // 場合（wasDue）だけが本来のステージ進行の対象になる。
  const wasDue = isNew || st.due <= Date.now();
  st.seen++;
  if(firstTryCorrect){
    st.right++;
    if(wasDue) st.stage = Math.min(st.stage+1, INTERVALS.length-1);
  }else if(retried){ // セッション内で間違えたあと正解
    st.right++;
    st.stage = 1;
  }else{ // 間違い
    st.wrong++;
    st.stage = 0;
  }
  if(wasDue || !firstTryCorrect) st.due = Date.now() + INTERVALS[st.stage]*DAY;
  save();
}

/* レベル: 必要XPが少しずつ増える */
const TITLES = ["見習い","冒険者","探求者","戦士","騎士","賢者","大賢者","勇者","覇者","伝説の勇者"];
function levelInfo(xp){
  let lvl=1, need=100, base=0;
  while(xp >= base+need){ base+=need; lvl++; need=100+ (lvl-1)*40; }
  return {lvl, cur:xp-base, need, title:TITLES[Math.min(TITLES.length-1, Math.floor((lvl-1)/3))]};
}

/* ============ 効果音（WebAudio） ============ */
let audioCtx = null;
function beep(freqs, dur){
  if(!S.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.12, audioCtx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i+1)*dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + i*dur); o.stop(audioCtx.currentTime + (i+1)*dur);
    });
  }catch(e){}
}

/* ============ ユーティリティ ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
/* 同じ教科が連続しないように並べ替え（インターリービング） */
function interleave(ids){
  const pool = shuffle(ids), out = [];
  while(pool.length){
    let idx = pool.findIndex(id => !out.length || BANK[id].s !== BANK[out[out.length-1]].s);
    if(idx === -1) idx = 0;
    out.push(pool.splice(idx,1)[0]);
  }
  return out;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* 入力式問題の答え合わせ。全角/半角・大文字小文字・カタカナ/ひらがな・記号のゆれを吸収したうえで比較する。
   数値として読めるものは数値としても比較する（例："1.50" と "1.5" を同一視）。 */
function normalizeAnswerText(s){
  s = String(s).trim();
  s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  s = s.replace(/[－ー−‐]/g, "-");
  s = s.replace(/．/g, ".");
  s = s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60));
  s = s.replace(/\s+/g, "");
  return s.toLowerCase();
}
function answersMatch(input, correct, accept){
  const ni = normalizeAnswerText(input);
  if(ni === "") return false;
  const candidates = [correct].concat(accept||[]).map(normalizeAnswerText);
  for(const c of candidates){
    if(ni === c) return true;
    const nf = Number(ni), cf = Number(c);
    if(!isNaN(nf) && !isNaN(cf) && c !== "" && Math.abs(nf-cf) < 1e-9) return true;
  }
  return false;
}

window.startQuest = ()=>{
  const due = shuffle(dueIds()).slice(0, QUEST_SIZE);
  let queue = due.slice();
  if(queue.length < QUEST_SIZE){
    // 教科がかたよらないよう新規問題をラウンドロビンで補充（習った単元のみ）
    const fresh = newUnlockedIds();
    const bySub = {};
    shuffle(fresh).forEach(i=>{ (bySub[BANK[i].s]=bySub[BANK[i].s]||[]).push(i); });
    const subs = shuffle(Object.keys(bySub));
    let k=0;
    while(queue.length < QUEST_SIZE && subs.some(s=>bySub[s].length)){
      const s = subs[k++ % subs.length];
      if(bySub[s].length) queue.push(bySub[s].pop());
    }
  }
  if(!queue.length){ alert("いま習っている範囲の問題はぜんぶクリア済み！\nまた明日きてね🌙（「特訓」タブから先取り学習もできます）"); return; }
  startSession(interleave(queue), "今日のクエスト");
};

let sess = null;
function startSession(ids, title){
  if(!ids.length){ go("home"); return; }
  sess = {
    title, queue:ids.slice(), total:ids.length,
    wrongOnce:new Set(), cleared:new Set(),
    firstTryCorrect:0, gainedXp:0, reviewCount:ids.filter(i=>S.items[i]).length,
    answeredThisQ:false,
  };
  nextQuestion();
}
function nextQuestion(){
  if(!sess.queue.length){ finishSession(); return; }
  const id = sess.queue[0];
  const q = BANK[id];
  const sub = SUBJECTS[q.s];
  const isInput = q.t === "input";
  sess.currentOrder = isInput ? null : shuffle([0,1,2,3]);
  sess.currentType = isInput ? "input" : "choice";
  sess.answeredThisQ = false;

  const pct = Math.round(sess.cleared.size / sess.total * 100);
  app.innerHTML = `
    <div class="row">
      <button class="btn-ghost" onclick="quitSession()">✕ やめる</button>
      <div class="grow"></div>
      <span class="pill">${esc(sess.title)}</span>
    </div>

    <div class="sub center">${sess.cleared.size} / ${sess.total} クリア ${sess.wrongOnce.has(id)?"（リベンジ問題！）":""}</div>
    <div class="card" style="margin-top:12px">
      <div class="row">
        <span class="pill" style="border-color:${sub.color};color:${sub.color}">${sub.emoji} ${sub.name}｜${esc(q.u)}</span>
        <div class="grow"></div>

      </div>
      <div class="qtext">${esc(q.q)}</div>
      ${isInput ? `
      <input type="text" id="ansIn" class="ans-input" placeholder="答えを入力" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn-main" onclick="answerInput()">✅ こたえる</button>
      ` : `
      <div id="choices">
        ${sess.currentOrder.map((ci,pos)=>`<button class="choice" id="ch${pos}" onclick="answer(${pos})">${"❶❷❸❹"[pos]} ${esc(q.c[ci])}</button>`).join("")}
      </div>`}
      <div id="fb"></div>
    </div>
    <div class="sub center">${isInput?"入力したらEnterキーでも答えられます":"キーボードの 1〜4 でも答えられます"}</div>`;
  if(isInput){ const el=document.getElementById("ansIn"); if(el) el.focus(); }
}
window.quitSession = ()=>{ if(confirm("クエストを中断しますか？（ここまでの記録は保存済み）")) go("home"); };

/* 正誤確定後の共通処理（XP・復習スケジュール・セッション状態の更新）。選択式・入力式の両方から呼ばれる。 */
function settleAnswer(id, correct){
  const q = BANK[id];
  const wasWrongBefore = sess.wrongOnce.has(id);
  const wasReview = !!S.items[id];
  S.answered++;
  let html;
  if(correct){
    soundOK();
    const xp = wasWrongBefore ? 5 : 10;
    S.xp += xp; sess.gainedXp += xp; S.correct++;
    if(!wasWrongBefore){ sess.firstTryCorrect++; if(q.t==="input") S.inputCorrect++; }
    if(wasReview && !wasWrongBefore) S.reviewDone++;
    sess.cleared.add(id);
    scheduleAnswer(id, !wasWrongBefore, wasWrongBefore);
    const st = S.items[id];
    const days = INTERVALS[st.stage];
    html = `<div class="feedback ok"><b>⭕ 正解！ +${xp} XP</b><br>${esc(q.e)}<br>
      <span class="sub">📅 次の復習：${days===0?"今日中":days+"日後"}（思い出す間隔を少しずつ広げると記憶が長持ちします）</span></div>
      <button class="btn-main" onclick="nextQuestion()">次へ ▶</button>`;
  }else{
    soundNG();
    sess.wrongOnce.add(id);
    sess.queue.push(id); // セッションの最後に再挑戦（正解するまで終わらない）
    scheduleAnswer(id, false, false);
    const correctText = q.t==="input" ? q.ans : q.c[0];
    html = `<div class="feedback ng"><b>❌ ざんねん…正解は「${esc(correctText)}」</b><br>${esc(q.e)}<br>
      <span class="sub">🔁 この問題はクエストの最後にもう一度出ます。自力で思い出せたら記憶に残ります！</span></div>
      <button class="btn-main" onclick="nextQuestion()">次へ ▶</button>`;
  }
  save();
  return html;
}

window.answer = (pos)=>{
  if(!sess || sess.answeredThisQ) return;
  sess.answeredThisQ = true;
  const id = sess.queue.shift();
  const chosen = sess.currentOrder[pos];
  const correct = (chosen === 0);
  const correctPos = sess.currentOrder.indexOf(0);

  for(let p=0;p<4;p++){
    const el = document.getElementById("ch"+p);
    el.disabled = true;
    if(p===correctPos) el.classList.add("correct");
    else if(p===pos) el.classList.add("wrong");
    else el.classList.add("dim");
  }

  const fbHtml = settleAnswer(id, correct);
  const fbEl = document.getElementById("fb");
  fbEl.innerHTML = fbHtml;
  ensureNextVisible();
};

window.answerInput = ()=>{
  if(!sess || sess.answeredThisQ) return;
  const el = document.getElementById("ansIn");
  if(!el) return;
  const val = el.value;
  if(normalizeAnswerText(val)===""){ el.focus(); return; }
  sess.answeredThisQ = true;
  const id = sess.queue.shift();
  const q = BANK[id];
  const correct = answersMatch(val, q.ans, q.accept);
  el.disabled = true;
  el.classList.add(correct?"correct":"wrong");
  const btn = app.querySelector('button[onclick="answerInput()"]');
  if(btn) btn.disabled = true;

  const fbHtml = settleAnswer(id, correct);
  document.getElementById("fb").innerHTML = fbHtml;
  ensureNextVisible();
};

/* 「次へ」ボタンが固定ナビの裏や画面外に隠れないよう、必要なぶんだけスクロールする。
   scrollIntoViewは「ほぼ表示済み」と判断すると動かないため、ナビの高さを引いて自前で計算する。 */
function ensureNextVisible(){
  const fbEl = document.getElementById("fb");
  const btn = fbEl && fbEl.querySelector("button");
  if(!btn) return;
  const navH = (document.querySelector("nav")||{}).offsetHeight || 74;
  const gap = 16;
  // innerHTML設定直後で同期的にレイアウトが取れるため、rAFを使わず即時にスクロールする
  // （rAFはタブ非表示時に発火しないことがあり、smoothスクロールも一部環境で不発のため使わない）
  const bottom = btn.getBoundingClientRect().bottom;        // ビューポート上端からの位置
  const limit = window.innerHeight - navH - gap;            // ナビより上に確保したい下端
  const overflow = bottom - limit;
  if(overflow > 0) window.scrollBy(0, overflow);
}

document.addEventListener("keydown",(ev)=>{
  if(btl){
    if(ev.key>="1" && ev.key<="4" && !btl.answeredThisQ){
      window.answerBattle(Number(ev.key)-1);
    }else if(ev.key==="Enter" && btl.answeredThisQ){
      ev.preventDefault(); // フォーカス中の古いボタンへのclick発火を防ぐ（進行不能・二重回答対策）
      window.btlNext();
    }
    return;
  }
  if(sess){
    if(sess.currentType==="input"){
      if(ev.key==="Enter"){
        ev.preventDefault();
        if(!sess.answeredThisQ) window.answerInput();
        else nextQuestion();
      }
      return; // 数字キーは入力欄への通常入力にまかせる（1〜4ショートカットを無効化）
    }
    if(ev.key>="1" && ev.key<="4" && !sess.answeredThisQ){
      const el = document.getElementById("ch"+(Number(ev.key)-1));
      if(el) window.answer(Number(ev.key)-1);
    }else if(ev.key==="Enter" && sess.answeredThisQ){
      ev.preventDefault(); // フォーカス中の古いボタンへのclick発火を防ぐ（進行不能・二重回答対策）
      nextQuestion();
    }
    return;
  }
  if(dojo){
    if(dojo.currentType==="input"){
      if(ev.key==="Enter"){
        ev.preventDefault();
        if(!dojo.answeredThisQ) window.answerDojo();
        else nextDojoQuestion();
      }
    }
  }
});
window.nextQuestion = nextQuestion;

  const tag = m.secret ? "｜<b style=\"color:#c026d3\">ゲキムズ</b>" : m.capturable ? "｜🎣 なかまにできる" : "｜強敵（なかま不可）";

    <span class="memoji">${m.emoji}</span>

function battleQueue(){
  // 出題対象は習った単元・4択形式のみ（入力式問題はバトルのUIに合わないため除外）。復習期限が来ている問題を優先的に混ぜる
  const battleEligible = i => BANK[i].t!=="input" && unitUnlocked(BANK[i].s,BANK[i].u);
  const due = shuffle(dueIds().filter(battleEligible));
  const rest = shuffle(BANK.map((_,i)=>i).filter(i=>battleEligible(i) && !due.includes(i)));
  return interleave(due.slice(0,15).concat(rest.slice(0,25)));
}

window.startBattle = (mi)=>{
  const m = MONSTERS[mi];
  const teamHp = {};
  S.team.members.forEach(t=>{ teamHp[t.id] = monsterMaxHp(t); });
  const activeId = (S.team.members[S.team.activeIndex] || S.team.members[0]).id;
  btl = {mi, m, ehp:m.hp, teamHp, activeId, queue:battleQueue(), combo:0,
         gainedXp:0, answeredThisQ:false, currentOrder:null, next:null, tookDamage:false};
  nextBattleQuestion();
};
function activeMember(){ return S.team.members.find(t=>t.id===btl.activeId); }

function hpClass(cur,max){ const r=cur/max; return r<=0.25?"danger":r<=0.5?"low":""; }

          <div class="row"><div class="grow"></div><span class="sub" id="ehptxt">${btl.ehp}/${m.hp}</span></div>
          <div class="hpbar${m.secret?" secret-hp":""}"><div id="ehp" class="${hpClass(btl.ehp,m.hp)}" style="width:${Math.round(btl.ehp/m.hp*100)}%"></div></div>

      </div>

window.quitBattle = ()=>{
  if(confirm("バトルからにげますか？（解答の記録は保存済み。戦績には数えません）")){ btl=null; go("battle"); }
};

window.answerBattle = (pos)=>{
  if(!btl || btl.answeredThisQ) return;
  btl.answeredThisQ = true;
  const id = btl.queue.shift();
  const q = BANK[id];
  const m = btl.m;
  const inst = activeMember();
  const chosen = btl.currentOrder[pos];
  const correct = (chosen === 0);
  const correctPos = btl.currentOrder.indexOf(0);
  const wasReview = !!S.items[id];

  for(let p=0;p<4;p++){
    const el = document.getElementById("ch"+p);
    el.disabled = true;
    if(p===correctPos) el.classList.add("correct");
    else if(p===pos) el.classList.add("wrong");
    else el.classList.add("dim");
  }

  S.answered++;
  if(correct){
    S.correct++;
    if(wasReview) S.reviewDone++;
    scheduleAnswer(id, true, false);
    btl.combo++;
    if(btl.combo > S.battle.maxCombo) S.battle.maxCombo = btl.combo;
    S.xp += 10; btl.gainedXp += 10;
    inst.xp += 8; // 出撃中のモンスターも正解のたびに育つ
    soundOK();
    save();
    const moves = movesForType(inst.type);
    const fbHtml = `<div class="feedback ok"><b>⭕ 正解！</b><br>${esc(q.e)}<br>
        <span class="sub">${btl.combo>=2?`⚡${btl.combo}コンボ中！ `:""}わざを選んでこうげきしよう</span></div>
      <div class="row" style="gap:8px;margin-top:8px">
        ${moves.map((mv,mi2)=>`<button class="choice" style="text-align:center" onclick="useMove(${mi2})">${mv.emoji} ${mv.name}</button>`).join("")}
      </div>`;
    document.getElementById("fb").innerHTML = fbHtml;
    ensureNextVisible();
    return; // ダメージ処理はuseMove()で行う（わざ選択待ち）
  }

  scheduleAnswer(id, false, false);
  btl.combo = 0;
  btl.tookDamage = true;
  const edmg = m.atk + Math.floor(Math.random()*3);
  btl.teamHp[inst.id] = Math.max(0, btl.teamHp[inst.id] - edmg);
  soundNG();
  const pl = document.getElementById("player");
  if(pl) pl.classList.add("hit");
  const maxHp = monsterMaxHp(inst);
  const bar = document.getElementById("php");
  if(bar){ bar.style.width = Math.round(btl.teamHp[inst.id]/maxHp*100)+"%"; bar.className = hpClass(btl.teamHp[inst.id],maxHp); }
  const phptxt = document.getElementById("phptxt");
  if(phptxt) phptxt.textContent = btl.teamHp[inst.id]+"/"+maxHp;
  let fbHtml = `<div class="feedback ng"><b>❌ 正解は「${esc(q.c[0])}」。${m.name}の反撃！ ${esc(inst.name)}に${edmg}ダメージ！</b><br>${esc(q.e)}<br>
    <span class="sub">${esc(m.line)}</span></div>`;
  save();

  const alive = S.team.members.filter(t=>btl.teamHp[t.id]>0);
  if(btl.teamHp[inst.id]<=0 && alive.length>0){
    fbHtml += `<div class="feedback ng" style="margin-top:8px"><b>💥 ${esc(inst.name)}は ひんしになった！</b></div>
      <button class="btn-main" onclick="openSwitch(true)">🔄 つぎのなかまを出す</button>`;
  }else if(btl.teamHp[inst.id]<=0){
    btl.next = loseBattle;
    fbHtml += `<button class="btn-main" onclick="btlNext()">😵 手持ちが全員たおれてしまった…</button>`;
  }else{
    btl.next = nextBattleQuestion;
    fbHtml += `<button class="btn-main" onclick="btlNext()">次へ ▶</button>`;
  }
  document.getElementById("fb").innerHTML = fbHtml;
  ensureNextVisible();
};

window.useMove = (moveIdx)=>{
  if(!btl) return;
  const inst = activeMember();
  const m = btl.m;
  const move = movesForType(inst.type)[moveIdx];
  const msgs = [];
  let dmg = 10 + Math.min(btl.combo-1, 3)*2; // コンボで最大+6
  if(btl.combo>=2) msgs.push(`⚡${btl.combo}コンボ！`);
  const mult = typeMultiplier(move.type, m.type);
  dmg = Math.round(dmg*mult);
  if(mult>=1.5) msgs.push("こうかは ばつぐんだ！");
  else if(mult<=0.6) msgs.push("こうかは いまひとつのようだ…");
  if(Math.random()<0.15){ dmg=Math.round(dmg*1.5); msgs.push("きゅうしょに あたった！"); }
  btl.ehp = Math.max(0, btl.ehp - dmg);
  soundAtk();
  const mob = document.getElementById("mob");
  if(mob){ mob.classList.add("hit"); if(btl.ehp<=0) mob.classList.add("fainted"); }
  const bar = document.getElementById("ehp");
  if(bar){ bar.style.width = Math.round(btl.ehp/m.hp*100)+"%"; bar.className = hpClass(btl.ehp,m.hp); }
  const ehptxt = document.getElementById("ehptxt");
  if(ehptxt) ehptxt.textContent = btl.ehp+"/"+m.hp;

  let fbHtml = `<div class="feedback ok"><b>${move.emoji} ${move.name}！ ${m.name}に ${dmg}ダメージ！</b> ${msgs.join(" ")}</div>`;
  save();
  if(btl.ehp<=0){
    btl.next = winBattle;
    fbHtml += `<button class="btn-main" onclick="btlNext()">🏆 しょうり！</button>`;
  }else{
    btl.next = nextBattleQuestion;
    fbHtml += `<button class="btn-main" onclick="btlNext()">次へ ▶</button>`;
  }
  document.getElementById("fb").innerHTML = fbHtml;
  ensureNextVisible();
};
window.btlNext = ()=>{ if(btl && btl.next){ const f=btl.next; btl.next=null; f(); } };

/* ---- 手持ちの交代（ひんし時の強制交代／自由交代） ---- */
window.openSwitch = (forced)=>{
  if(!btl) return;
  const rows = S.team.members.map(t=>{
    const hp = btl.teamHp[t.id];
    const maxHp = monsterMaxHp(t);
    const fainted = hp<=0;
    const isActive = t.id===btl.activeId;
    return `<button class="monster-row ${fainted?"locked":""}" ${fainted||isActive?"disabled":""} onclick="switchTo(${t.id})">
      <span class="memoji">${t.emoji}</span>
      <div class="grow"><b>${esc(t.name)} <span class="sub">Lv.${monsterLevel(t)}</span></b>
        <div class="sub">HP ${hp}/${maxHp}${isActive?"（出撃中）":fainted?"（ひんし）":""}</div></div>
    </button>`;
  }).join("");
  app.innerHTML = `<h1 style="margin-bottom:12px">🔄 交代するモンスターを選ぼう</h1>
    <div class="card">${rows}</div>
    ${forced?"":'<button class="btn-sub" onclick="cancelSwitch()">キャンセル</button>'}`;
};
window.cancelSwitch = ()=>{ nextBattleQuestion(); };
window.switchTo = (id)=>{
  if(!btl) return;
  const t = S.team.members.find(x=>x.id===id);
  if(!t || btl.teamHp[t.id]<=0) return;
  btl.activeId = id;
  nextBattleQuestion();
};

function winBattle(){
  const m = btl.m, mi = btl.mi;
  const firstClear = (mi === S.battle.stage);
  const bonus = 20 + m.lv*3;
  S.xp += bonus; btl.gainedXp += bonus;
  S.battle.wins++;
  if(m.secret && !btl.tookDamage) S.battle.secretNoHitWins++;
  if(firstClear) S.battle.stage++;
  const inst = activeMember();
  inst.xp += 15; // しょうりボーナス経験値
  updateStreak();
  const newBadges = checkNewBadges();
  save();
  soundWin();
  const nextM = MONSTERS[S.battle.stage];
  const doneBtl = btl; btl = null;
  app.innerHTML = `
    <div class="card center">
      <div class="result-emoji">🏆</div>
      <h1>${m.emoji} ${m.name}を たおした！</h1>
      <div class="stat3">
        <div><div class="v" style="color:var(--gold)">+${doneBtl.gainedXp}</div><div class="k">獲得XP（ボーナス+${bonus}）</div></div>
        <div><div class="v">${inst.emoji} Lv.${monsterLevel(inst)}</div><div class="k">${esc(inst.name)}</div></div>

      ${newBadges.map(b=>`<div class="feedback ok" style="margin-bottom:10px"><b>${b.emoji} バッジ獲得「${b.name}」</b><br><span class="sub">${b.desc}</span></div>`).join("")}

      <button class="btn-sub" onclick="go('home')">ホームへ</button>

  nav("battle");
}

let pendingCapture = null;

    return;
  }
  const inst = makeMonsterInstance({emoji:m.emoji, name, type:m.type, speciesBase:m.speciesBase});
  S.team.members.push(inst);
  const newBadges = checkNewBadges();
  save();
  renderCaptureResult(inst, newBadges);
};
function renderReleasePicker(){
  const rows = S.team.members.map((t,idx)=>`<button class="monster-row" onclick="releaseAndCapture(${idx})">
    <span class="memoji">${t.emoji}</span>
    <div class="grow"><b>${esc(t.name)} <span class="sub">Lv.${monsterLevel(t)}</span></b></div>
    <span>にがす</span></button>`).join("");
  app.innerHTML = `<h1 style="margin-bottom:12px">🎒 手持ちがいっぱい！</h1>
    <div class="sub" style="margin-bottom:10px">だれかを1体にがして、新しいなかまと交代する？</div>
    <div class="card">${rows}</div>
    <button class="btn-sub" onclick="cancelCapture()">やめておく</button>`;
}
window.releaseAndCapture = (idx)=>{
  if(!pendingCapture) return;
  const m = MONSTERS[pendingCapture.mi];
  const name = CAPTURE_NAME[m.speciesBase] || m.speciesBase || m.name;
  const inst = makeMonsterInstance({emoji:m.emoji, name, type:m.type, speciesBase:m.speciesBase});
  S.team.members.splice(idx, 1, inst);
  if(S.team.activeIndex>=S.team.members.length) S.team.activeIndex = 0;
  const newBadges = checkNewBadges();
  save();
  pendingCapture = null;
  renderCaptureResult(inst, newBadges);
};
window.cancelCapture = ()=>{ pendingCapture = null; go("battle"); };
function renderCaptureResult(inst, newBadges){
  app.innerHTML = `<div class="card center">
    <div class="result-emoji">🎣</div>
    <h1>${esc(inst.name)}が なかまになった！</h1>
    <div class="sub" style="margin:10px 0">${inst.emoji} Lv.${monsterLevel(inst)}｜個体値 HP+${inst.iv.hp} こうげき+${inst.iv.atk}</div>
    ${newBadges.map(b=>`<div class="feedback ok" style="margin-bottom:10px"><b>${b.emoji} バッジ獲得「${b.name}」</b><br><span class="sub">${b.desc}</span></div>`).join("")}
    <button class="btn-main" onclick="go('battle')">バトルにもどる</button>
    <button class="btn-sub" onclick="viewTeam()">🎒 手持ちを見る</button>
  </div>`;
}

/* ---- バッジ ---- */
function renderBadges(){
  app.innerHTML = `<h1 style="margin-bottom:12px">🏆 バッジコレクション</h1>
    <div class="card">
    ${BADGES.map(b=>{
      const got = S.badges.includes(b.id);
      return `<div class="badge ${got?"":"locked"}">
        <span class="bemoji">${b.emoji}</span>
        <div><b>${b.name}</b><div class="sub">${b.desc}</div></div>
        <div class="grow"></div>${got?"✅":"🔒"}
      </div>`;
    }).join("")}
    </div>
    <div class="card sub">ここまでの記録：セッション${S.sessions}回／のべ${S.answered}問に挑戦／${S.correct}問正解</div>`;
}

/* ---- 学習のしくみ ---- */
function renderScience(){
  app.innerHTML = `<h1 style="margin-bottom:12px">🧠 このアプリの学習のしくみ</h1>
  <div class="card science">
    <p>まなびクエストは「なんとなく楽しい」だけでなく、<b>記憶と学習の研究で効果が確かめられた方法</b>だけを組み合わせて作られています。</p>

    <h3>1. 間隔反復（分散学習）— 忘れる直前に思い出す</h3>
    <p>人は覚えたことを1日で急速に忘れます（エビングハウスの忘却曲線）。しかし<b>忘れかけたタイミングで復習</b>すると、記憶はどんどん長持ちするようになります。このアプリは正解するたびに次の復習を「1日後→3日後→7日後→14日後→30日後」と自動で間隔を広げます。</p>
    <cite>Ebbinghaus (1885)／Cepeda et al. (2006) の254研究のメタ分析：分散学習は一夜漬けより長期記憶を大きく改善</cite>

    <h3>2. 検索練習（テスト効果）— 読むより思い出す</h3>
    <p>教科書を読み直すより、<b>問題に答えて記憶から「取り出す」</b>方が、長期的に約1.5倍以上記憶に残ることが実験で示されています。だからこのアプリはすべてクイズ形式です。</p>
    <cite>Roediger & Karpicke (2006), Psychological Science：1週間後のテストで再読グループを大きく上回る</cite>

    <h3>3. 即時フィードバック — 直後の解説で修正</h3>
    <p>答えた<b>直後</b>に正誤と理由がわかると、誤った理解がそのまま定着するのを防げます。全問に「なぜそうなるか」の解説つき。</p>
    <cite>Hattie & Timperley (2007)：フィードバックは学力への効果が最も大きい介入のひとつ</cite>

    <h3>4. インターリービング — 教科を混ぜて出題</h3>
    <p>同じ単元を続けて解くより、<b>違う種類の問題を混ぜる</b>方が「どの解き方を使うか」を毎回考えるため、テスト本番に強い力がつきます。今日のクエストは5教科ミックスです。</p>
    <cite>Rohrer & Taylor (2007)：混合練習グループは1週間後のテストで成績が大きく向上</cite>

    <h3>5. まちがい直し — 正解するまで終わらない</h3>
    <p>まちがえた問題はクエストの最後にもう一度出ます。<b>自力で思い出して正解し直す</b>ことが、次に同じミスをしない一番の近道です。</p>

    <h3>6. ゲーミフィケーション — 続けられる仕組み</h3>
    <p>XP・レベル・連続日数・バッジは「今日もやろう」という気持ちを支えるためのものです。学習は<b>短時間でも毎日続ける</b>ことが最も効果的だからこそ、続けたくなる仕掛けを入れています。「まなびバトル」も同じで、なかまを集めて育てるポケモン風の対戦という形をとっていますが、中身はすべて検索練習（クイズ）です。バトル中の解答も復習スケジュールにきちんと記録されます。5教科を五角形の相性にした「タイプ相性」は、5教科をまんべんなく学ぶきっかけになるよう設計しています。</p>
    <cite>Hamari et al. (2014) のレビュー／自己決定理論 (Deci & Ryan)：達成の可視化は内発的動機づけを支える</cite>

    <h3>7. カリキュラム連動 — 習ったところから出題</h3>
    <p>学校の授業進度（前期後期制・標準的な教科書の年間計画）に合わせて、<b>いま習っている範囲までの単元</b>だけが今日のクエストに登場します（現在：${termName()}・〜${monthLabel(schoolMonth())}）。授業で習う→その日のうちにクイズで思い出す、が最強の組み合わせです。未習単元は「特訓」タブから先取りもできます。</p>

    <h3>8. 修行の部屋 — 自動化（考えなくても解ける状態）をつくる</h3>
    <p>二桁の足し算・引き算、九九、漢字の読みなどの基礎は、いちいち考えて解いているうちは本番で時間が足りなくなります。<b>反応が自動化するまで反復する</b>ことで、頭を「考える部分」に使う余裕が生まれます。「特訓」タブの中の「修行の部屋」では、これらを入力式でテンポよく反復練習できます。</p>
    <cite>Logan (1988) の自動化理論／流暢性（フルーエンシー）研究：基礎処理の自動化は上位の思考課題の成績を高める</cite>

    <h3>📚 収録範囲（中学1年）</h3>
    <p>数学（正負の数・文字と式・一次方程式・比例と反比例・平面図形・空間図形・データの活用）／英語（be動詞・一般動詞・疑問詞・命令文とcan・名詞と代名詞・三単現・現在進行形・過去形）／国語（漢字・文法・語彙）／理科（植物・物質・光音力・大地）／社会（世界の姿・気候と暮らし・歴史 古代〜鎌倉）— 全${BANK.length}問</p>

    <h3>🔒 プライバシーについて（保護者の方へ）</h3>
    <p>このアプリは<b>名前・メールアドレスなどの個人情報を一切集めません</b>。アカウント登録も不要です。学習の記録（XPや正誤）は<b>お使いの端末のブラウザの中だけ</b>に保存され、外部のサーバーには送信されません。広告・アクセス解析・Cookieも使っていません。記録を消したいときは下のボタンでいつでも削除できます。</p>

    <h3>⚠️ ご利用にあたって</h3>
    <p>本アプリは中学1年の学習範囲をもとに作成した<b>学習支援ツール</b>です。内容は正確を期していますが、誤りが含まれる可能性があります。テスト対策では、必ず学校の授業と教科書の内容を優先してください。単元の学習時期はあくまで一般的な目安で、学校や教科書によって前後します。</p>

    <button class="btn-sub" onclick="resetAll()" style="color:var(--ng)">学習データをリセットする</button>
    <p class="sub center" style="margin-top:14px">まなびクエスト 中1 ・ 個人学習用の無料アプリ</p>
  </div>`;
}
window.resetAll = ()=>{
  if(confirm("本当にすべての学習記録を消しますか？この操作は取り消せません。")){
    localStorage.removeItem(KEY); S = load(); go("home");
  }
};

/* 起動 */
go("home");
</script>
