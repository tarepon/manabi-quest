<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 外部への通信・外部リソース読み込みを全面禁止（このアプリは端末内で完結する） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>まなびクエスト 小3 — 科学的ゲーミング学習</title>
<style>
  :root{
    --bg:#0f1425; --panel:#1a2138; --panel2:#222b4a; --line:#2e3a63;
    --text:#eef1fb; --sub:#9aa5c9;
    --sansu:#4f8ef7; --kokugo:#f7a44f; --rika:#3ecf8e; --shakai:#b48ef7;
    --gold:#ffd166; --ok:#3ecf8e; --ng:#f75f6d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:radial-gradient(1200px 600px at 50% -100px,#1b2445,var(--bg));
    color:var(--text); min-height:100vh;
  }
  #app{max-width:540px;margin:0 auto;padding:16px 16px 120px;}
  h1{font-size:23px} h2{font-size:19px;margin-bottom:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .grow{flex:1}
  .sub{color:var(--sub);font-size:14px;line-height:1.7}
  .big{font-size:26px;font-weight:800}
  button{
    font-family:inherit;border:none;border-radius:14px;cursor:pointer;
    font-size:17px;font-weight:700;color:var(--text);
  }
  .btn-main{
    width:100%;padding:17px;background:linear-gradient(135deg,#5b7cfa,#8a5bfa);
    box-shadow:0 6px 20px rgba(90,110,250,.35);margin-top:6px;
  }
  .btn-main:active{transform:scale(.98)}
  .btn-sub{width:100%;padding:14px;background:var(--panel2);border:1px solid var(--line);margin-top:8px;}
  .btn-ghost{background:none;color:var(--sub);font-size:14px;padding:8px;font-weight:600}
  /* XP bar */
  .xpbar{height:12px;background:#0c1020;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .xpbar>div{height:100%;background:linear-gradient(90deg,#ffd166,#ff9f43);transition:width .5s}
  .masterybar{height:8px;background:#0c1020;border-radius:99px;overflow:hidden}
  .masterybar>div{height:100%;transition:width .5s}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
  /* quiz */
  .qtext{font-size:20px;font-weight:700;line-height:1.8;margin:14px 0 18px}
  .choice{
    display:block;width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;
    background:var(--panel2);border:2px solid var(--line);border-radius:14px;
    font-size:17px;font-weight:600;line-height:1.6;
  }
  .choice:active{transform:scale(.99)}
  .choice.correct{border-color:var(--ok);background:rgba(62,207,142,.15)}
  .choice.wrong{border-color:var(--ng);background:rgba(247,95,109,.15)}
  .choice.dim{opacity:.45}
  .feedback{border-radius:14px;padding:14px;margin-top:6px;font-size:14px;line-height:1.8;animation:pop .25s}
  .feedback.ok{background:rgba(62,207,142,.12);border:1px solid var(--ok)}
  .feedback.ng{background:rgba(247,95,109,.12);border:1px solid var(--ng)}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .progress{height:10px;background:#0c1020;border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .progress>div{height:100%;background:linear-gradient(90deg,#3ecf8e,#4f8ef7);transition:width .3s}
  /* nav */
  nav{
    position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,37,.95);
    border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:10;
  }
  nav .inner{max-width:540px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;padding:10px 4px 14px;font-size:11px;color:var(--sub);font-weight:600}
  nav button.active{color:var(--gold)}
  nav .ico{display:block;font-size:20px;margin-bottom:2px}
  .badge{
    display:flex;gap:12px;align-items:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;
  }
  .badge.locked{opacity:.4;filter:grayscale(1)}
  .badge .bemoji{font-size:30px}
  .unit-btn{
    display:flex;align-items:center;gap:10px;width:100%;padding:14px;margin-bottom:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;text-align:left;font-size:16px;
  }
  .streak-flame{font-size:34px;filter:drop-shadow(0 0 8px rgba(255,160,60,.6))}
  .science h3{font-size:16px;margin:16px 0 6px;color:var(--gold)}
  .science p{font-size:14px;line-height:1.9;color:#cdd5ef}
  .science cite{display:block;font-size:12px;color:var(--sub);margin-top:4px;font-style:normal}
  .result-emoji{font-size:56px;text-align:center;margin:10px 0}
  .stat3{display:flex;text-align:center;margin:14px 0}
  .stat3>div{flex:1}
  .stat3 .v{font-size:22px;font-weight:800}
  .stat3 .k{font-size:12px;color:var(--sub)}
  .duechip{font-size:12px;color:var(--sub)}
  .center{text-align:center}
  a{color:#8fb3ff}
  /* battle */
  .hpbar{height:14px;background:#0c1020;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .hpbar>div{height:100%;background:linear-gradient(90deg,#3ecf8e,#9be15d);transition:width .4s}
  .hpbar>div.low{background:linear-gradient(90deg,#ffd166,#f7a44f)}
  .hpbar>div.danger{background:linear-gradient(90deg,#f75f6d,#ff8fa0)}
  .monster-emoji{font-size:64px;text-align:center;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));transition:opacity .5s,filter .5s}
  .monster-emoji.fainted{opacity:.25;filter:grayscale(1)}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .hit{animation:shakeX .4s}
  .combo-chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;
    background:linear-gradient(135deg,#ffd166,#ff9f43);color:#33230a}
  .monster-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:14px;text-align:left;font-size:15px}
  .monster-row .memoji{font-size:32px}
  .monster-row.beaten .memoji{filter:grayscale(.4)}
  .monster-row.locked{opacity:.45;filter:grayscale(1)}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="inner" id="nav"></div></nav>

<script>
"use strict";
/* =====================================================================
   まなびクエスト 小3
   根拠のある学習メカニズム:
   - 間隔反復 (Ebbinghaus 1885; Cepeda et al. 2006)
   - 検索練習・テスト効果 (Roediger & Karpicke 2006)
   - 即時フィードバック (Hattie & Timperley 2007)
   - インターリービング (Rohrer & Taylor 2007)
   - 習慣化・動機づけ (Deci & Ryan; Hamari et al. 2014)
   小学3年生向けに、教科数・出題数・言葉づかいを学習容量に合わせて調整。
   ===================================================================== */

const SUBJECTS = {
  sansu :{name:"算数", emoji:"🧮", color:"var(--sansu)"},
  kokugo:{name:"国語", emoji:"📖", color:"var(--kokugo)"},
  rika  :{name:"理科", emoji:"🔬", color:"var(--rika)"},
  shakai:{name:"社会", emoji:"🌏", color:"var(--shakai)"},
};

/* 問題バンク: c[0]が正解（表示時にシャッフル） */
const BANK = [
/* ===== 算数・たし算とひき算の筆算 ===== */
{s:"sansu",u:"たし算とひき算の筆算",q:"245+367 の答えは？",c:["612","502","622","512"],e:"一の位から順にたし算します。5+7=12で2を書いて1くり上げ、4+6+1=11で1を書いて1くり上げ、2+3+1=6。答えは612。"},
{s:"sansu",u:"たし算とひき算の筆算",q:"900−356 の答えは？",c:["544","554","644","454"],e:"一の位は0から6を引けないので、となりから借りて計算します。900−356=544。"},
{s:"sansu",u:"たし算とひき算の筆算",q:"528+275 の答えは？",c:["803","793","813","703"],e:"一の位8+5=13で3を書いて1くり上げ、十の位2+7+1=10で0を書いて1くり上げ、百の位5+2+1=8。答えは803。"},
{s:"sansu",u:"たし算とひき算の筆算",q:"ひっ算で位をそろえて書くのは何のため？",c:["同じ位どうしを計算するため","数字を大きく見せるため","答えを早く出すため","見た目をきれいにするため"],e:"一の位は一の位どうし、十の位は十の位どうしで計算するために、位をそろえて書きます。"},
{s:"sansu",u:"たし算とひき算の筆算",q:"くり上がりが起きるのはどんなとき？",c:["同じ位の数の和が10以上になるとき","同じ位の数の差がマイナスになるとき","位がそろわないとき","一の位が0のとき"],e:"同じ位どうしをたして10以上になったら、上の位に1くり上げます。"},
/* ===== 算数・かけ算の筆算 ===== */
{s:"sansu",u:"かけ算の筆算",q:"23×4 の答えは？",c:["92","86","96","88"],e:"20×4=80、3×4=12。80+12=92。"},
{s:"sansu",u:"かけ算の筆算",q:"かけ算の答えを何という？",c:["積","和","差","商"],e:"たし算の答え＝和、ひき算の答え＝差、かけ算の答え＝積、わり算の答え＝商です。"},
{s:"sansu",u:"かけ算の筆算",q:"15×6 の答えは？",c:["90","80","96","84"],e:"10×6=60、5×6=30。60+30=90。"},
{s:"sansu",u:"かけ算の筆算",q:"40×7 の答えは？",c:["280","270","290","240"],e:"4×7=28に0を1つつけて280。"},
{s:"sansu",u:"かけ算の筆算",q:"かけ算の筆算で、一の位から順に計算するのはなぜ？",c:["くり上がりを次の位に足すため","見た目をきれいにするため","答えを覚えやすくするため","十の位を先に計算すると間違えやすいため"],e:"一の位から計算することで、くり上がった数をとなりの位の計算にそのまま足せます。"},
/* ===== 算数・わり算 ===== */
{s:"sansu",u:"わり算",q:"24÷6 の答えは？",c:["4","3","5","6"],e:"6×4=24なので、24÷6=4。"},
{s:"sansu",u:"わり算",q:"わり算の答えを何という？",c:["商","積","和","差"],e:"わり算の答えは「商（しょう）」といいます。"},
{s:"sansu",u:"わり算",q:"45÷5 の答えは？",c:["9","8","7","10"],e:"5×9=45なので、45÷5=9。"},
{s:"sansu",u:"わり算",q:"20÷3 を計算すると、あまりはいくつ？",c:["あまり2","あまり1","あまり3","わりきれる"],e:"3×6=18で、20−18=2。20÷3=6あまり2。"},
{s:"sansu",u:"わり算",q:"わり算で「わられる数」と「わる数」が同じとき、答えはいつも？",c:["1","0","わり算できない","わられる数と同じ"],e:"たとえば7÷7=1のように、同じ数どうしのわり算の答えはいつも1になります。"},
/* ===== 算数・大きな数 ===== */
{s:"sansu",u:"大きな数",q:"10000（1万）を10こ集めた数は？",c:["十万","一万","百万","千万"],e:"1万を10こ集めると10万になります。0が1つ増えるごとに10倍になります。"},
{s:"sansu",u:"大きな数",q:"1000万を10こ集めると？",c:["1億","100万","1000億","1兆"],e:"1000万を10こ集めると1億（100000000）になります。"},
{s:"sansu",u:"大きな数",q:"「3050600」を漢字で書くと？",c:["三百五万六百","三十五万六百","三百五万六千","三百万五百六十"],e:"右から4けたごとに区切ると「305」「0600」。305万0600＝三百五万六百です。"},
{s:"sansu",u:"大きな数",q:"一万は、千を何こ集めた数？",c:["10こ","100こ","1000こ","1こ"],e:"千が10こで一万（10000）になります。"},
{s:"sansu",u:"大きな数",q:"99999より1大きい数は？",c:["100000","99998","100001","9999"],e:"9が5つ並んだ数に1を足すと、位が1つ上がって100000になります。"},
/* ===== 算数・長さ・重さ・かさ ===== */
{s:"sansu",u:"長さ・重さ・かさ",q:"1kmは何mですか？",c:["1000m","100m","10000m","10m"],e:"1km＝1000mです。長い道のりをはかるときに使います。"},
{s:"sansu",u:"長さ・重さ・かさ",q:"1kgは何gですか？",c:["1000g","100g","10000g","10g"],e:"1kg＝1000gです。"},
{s:"sansu",u:"長さ・重さ・かさ",q:"1Lは何dLですか？",c:["10dL","100dL","1000dL","1dL"],e:"1L＝10dLです。"},
{s:"sansu",u:"長さ・重さ・かさ",q:"1Lは何mLですか？",c:["1000mL","100mL","10000mL","10mL"],e:"1L＝1000mLです。"},
{s:"sansu",u:"長さ・重さ・かさ",q:"プールの長さをはかるのにいちばん合う単位は？",c:["m（メートル）","mm（ミリメートル）","g（グラム）","dL（デシリットル）"],e:"プールのような長い長さには m（メートル）や km（キロメートル）を使います。"},
/* ===== 算数・円と球 ===== */
{s:"sansu",u:"円と球",q:"円のまん中の点を何という？",c:["中心","直径","半径","円周"],e:"円のまん中の点を「中心」といいます。"},
{s:"sansu",u:"円と球",q:"円の中心から円のまわりまでひいた直線を何という？",c:["半径","直径","中心","円周"],e:"中心からまわりまでの直線を「半径」といいます。"},
{s:"sansu",u:"円と球",q:"直径10cmの円の半径は？",c:["5cm","10cm","20cm","15cm"],e:"直径は半径の2倍なので、半径は直径の半分の5cmです。"},
{s:"sansu",u:"円と球",q:"球（ボールのような形）を、どこで切っても切り口はどんな形になる？",c:["円","三角形","四角形","楕円"],e:"球はどこで切っても切り口はかならず円になります。"},
{s:"sansu",u:"円と球",q:"半径4cmの円の直径は？",c:["8cm","4cm","2cm","16cm"],e:"直径は半径の2倍なので、4cm×2=8cmです。"},
/* ===== 算数・三角形と分数 ===== */
{s:"sansu",u:"三角形と分数",q:"3つの辺の長さがすべて同じ三角形を何という？",c:["正三角形","二等辺三角形","直角三角形","不等辺三角形"],e:"3つの辺の長さがすべて同じ三角形を「正三角形」といいます。"},
{s:"sansu",u:"三角形と分数",q:"2つの辺の長さが同じ三角形を何という？",c:["二等辺三角形","正三角形","直角三角形","平行四辺形"],e:"2つの辺の長さが同じ三角形を「二等辺三角形」といいます。"},
{s:"sansu",u:"三角形と分数",q:"ケーキを同じ大きさに4つに切った1つ分を分数で表すと？",c:["4分の1","4分の4","1分の4","2分の1"],e:"4つに等しく分けた1つ分は「4分の1（1/4）」と表します。"},
{s:"sansu",u:"三角形と分数",q:"2分の1 と 4分の2 の大きさを比べると？",c:["同じ大きさ","2分の1の方が大きい","4分の2の方が大きい","比べられない"],e:"2分の1と4分の2は形はちがって見えますが、同じ大きさを表しています。"},
{s:"sansu",u:"三角形と分数",q:"正三角形の3つの角の大きさは？",c:["すべて同じ","すべてちがう","2つだけ同じ","決まっていない"],e:"正三角形は辺の長さがすべて同じなので、角の大きさもすべて同じになります。"},
/* ===== 国語・漢字の読み書き ===== */
{s:"kokugo",u:"漢字の読み書き",q:"「安心する」の読み方は？",c:["あんしん","あんこ","やすごころ","あんじん"],e:"安心＝心配なくおだやかな気持ちでいること。"},
{s:"kokugo",u:"漢字の読み書き",q:"「運動場を走る」の「運動」の読み方は？",c:["うんどう","はこどう","うごき","ゆんどう"],e:"運動＝体を動かすこと。「運」も「動」も3年生で習う漢字です。"},
{s:"kokugo",u:"漢字の読み書き",q:"「かなしい」を漢字で書くと？",c:["悲しい","哀しい","憂しい","苦しい"],e:"「悲しい」と書きます。「悲」は3年生で習う漢字です。"},
{s:"kokugo",u:"漢字の読み書き",q:"「祭りの日」の「祭」の読み方は？",c:["まつり","さい","いわい","さかり"],e:"祭＝まつり。「祭日」のように「さい」と読むこともあります。"},
{s:"kokugo",u:"漢字の読み書き",q:"「美しい花」の「美」の読み方は？",c:["うつくしい","きれい","よい","はなやか"],e:"美＝うつくしい。見た目がとてもよいこと。"},
{s:"kokugo",u:"漢字の読み書き",q:"「薬を飲む」の「薬」の読み方は？",c:["くすり","やく","どく","つゆ"],e:"薬＝くすり。病気やけがを治すために飲んだりぬったりするものです。"},
/* ===== 国語・こそあど言葉 ===== */
{s:"kokugo",u:"こそあど言葉",q:"「これ・それ・あれ・どれ」のような言葉を何という？",c:["こそあど言葉","かざり言葉","つなぎ言葉","気持ち言葉"],e:"物や場所などを指し示す言葉を「こそあど言葉」といいます。"},
{s:"kokugo",u:"こそあど言葉",q:"話す人の近くにあるものを指す言葉は？",c:["これ","それ","あれ","どれ"],e:"自分の近くのものは「これ」、相手の近くのものは「それ」で表します。"},
{s:"kokugo",u:"こそあど言葉",q:"話す人からも聞く人からも遠くにあるものを指す言葉は？",c:["あれ","これ","それ","どれ"],e:"どちらからも遠いものは「あれ」で表します。"},
{s:"kokugo",u:"こそあど言葉",q:"たずねるときに使う言葉はどれ？",c:["どれ","これ","それ","あれ"],e:"どれ・どこ・どちらなど「ど」がつく言葉は、たずねるときに使います。"},
{s:"kokugo",u:"こそあど言葉",q:"「その本を貸してください」の「その」は、何を指す言葉？",c:["聞く人の近くにあるもの","話す人の近くにあるもの","どちらからも遠いもの","わからないもの"],e:"「そ」がつく言葉は、聞く人（相手）の近くにあるものを指します。"},
/* ===== 国語・主語と述語 ===== */
{s:"kokugo",u:"主語と述語",q:"「花がさく」の主語はどれ？",c:["花が","さく","きれいに","とても"],e:"文の中で「何が（は）」にあたる部分を主語といいます。"},
{s:"kokugo",u:"主語と述語",q:"「花がさく」の述語はどれ？",c:["さく","花が","きれいに","とても"],e:"文の中で「どうする」にあたる部分を述語といいます。"},
{s:"kokugo",u:"主語と述語",q:"文の中で「何が（は）」にあたる部分を何という？",c:["主語","述語","修飾語","接続語"],e:"「何が」「だれは」にあたる部分を主語といいます。"},
{s:"kokugo",u:"主語と述語",q:"文の中で「どうする」「どんなだ」にあたる部分を何という？",c:["述語","主語","修飾語","接続語"],e:"「どうする」「どんなだ」「何だ」にあたる部分を述語といいます。"},
{s:"kokugo",u:"主語と述語",q:"「弟は元気だ」の述語はどれ？",c:["元気だ","弟は","は","だ"],e:"「どんなだ」にあたる「元気だ」が述語です。"},
/* ===== 国語・ことわざ・慣用句 ===== */
{s:"kokugo",u:"ことわざ・慣用句",q:"「犬も歩けば棒に当たる」の意味に近いのは？",c:["何かをすれば思いがけないことに出会う","犬は歩くのが好き","じっとしているのがよい","棒を持って歩くとよい"],e:"何かをすると、思いがけないこと（よいこと・わるいこと）に出会う、という意味です。"},

{s:"kokugo",u:"ことわざ・慣用句",q:"「耳をすます」の意味は？",c:["注意してよく聞く","耳をきれいにする","音を出さない","耳が痛くなる"],e:"音がよく聞こえるように、注意深く聞くことを「耳をすます」といいます。"},

function schoolMonth(){ return ((new Date().getMonth()+1) - 4 + 12) % 12 + 1; } // 4月=1
function termName(){ const sm=schoolMonth(); return sm<=5 ? "1学期" : sm<=9 ? "2学期" : "3学期"; }
function monthLabel(sm){ return ((sm+2)%12+1) + "月"; }
function unitUnlocked(s,u){ const sm = CURRICULUM[s+"|"+u]; return sm===undefined || sm <= schoolMonth(); }

/* ============ 学習エンジン（間隔反復・Leitner+SM-2簡易版） ============ */
const DAY = 24*60*60*1000;
const INTERVALS = [0, 1, 3, 7, 14, 30]; // stage→次に出すまでの日数

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && d.items) return d;
  }catch(e){}
  return {xp:0, answered:0, correct:0, reviewDone:0, sessions:0,
          streak:0, lastDay:null, badges:[], perfectRuns:0, items:{}, sound:true,
          battle:{stage:0, wins:0, losses:0, maxCombo:0}};
}
/* 旧バージョンの保存データにはbattleがないため補完 */
if(!S.battle) S.battle = {stage:0, wins:0, losses:0, maxCombo:0};
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function itemState(id){ return S.items[id]; }
function dueIds(){
  const now = Date.now();
  return Object.keys(S.items).filter(id => S.items[id].due <= now).map(Number);
}
function newUnlockedIds(){
  // 新しい問題は「もう習った単元」だけから出す（予約済みの復習は単元にかかわらず出る）
  return BANK.map((_,i)=>i).filter(i => !S.items[i] && unitUnlocked(BANK[i].s, BANK[i].u));
}
function scheduleAnswer(id, firstTryCorrect, retried){
  let st = S.items[id];
  if(!st){ st = S.items[id] = {stage:0, due:0, seen:0, right:0, wrong:0}; }
  st.seen++;
  if(firstTryCorrect){
    st.right++;
    st.stage = Math.min(st.stage+1, INTERVALS.length-1);
  }else if(retried){ // セッション内で間違えたあと正解
    st.right++;
    st.stage = 1;
  }else{ // 間違い
    st.wrong++;
    st.stage = 0;
  }
  st.due = Date.now() + INTERVALS[st.stage]*DAY;
  save();
}

/* レベル: 必要XPが少しずつ増える */
const TITLES = ["見習い","冒険者","探求者","戦士","騎士","賢者","大賢者","勇者","覇者","伝説の勇者"];
function levelInfo(xp){
  let lvl=1, need=100, base=0;
  while(xp >= base+need){ base+=need; lvl++; need=100+ (lvl-1)*40; }
  return {lvl, cur:xp-base, need, title:TITLES[Math.min(TITLES.length-1, Math.floor((lvl-1)/3))]};
}

function updateStreak(){
  const today = todayStr();
  if(S.lastDay !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yStr = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    S.streak = (S.lastDay===yStr) ? S.streak+1 : 1;
    S.lastDay = today;
  }
}

/* ============ 効果音（WebAudio） ============ */
let audioCtx = null;
function beep(freqs, dur){
  if(!S.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.12, audioCtx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i+1)*dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + i*dur); o.stop(audioCtx.currentTime + (i+1)*dur);
    });
  }catch(e){}
}

/* ============ ユーティリティ ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
/* 同じ教科が連続しないように並べ替え（インターリービング） */
function interleave(ids){
  const pool = shuffle(ids), out = [];
  while(pool.length){
    let idx = pool.findIndex(id => !out.length || BANK[id].s !== BANK[out[out.length-1]].s);
    if(idx === -1) idx = 0;
    out.push(pool.splice(idx,1)[0]);
  }
  return out;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

window.startPractice = (s,u)=>{
  if(!unitUnlocked(s,u)){
    const sm = CURRICULUM[s+"|"+u];
    if(!confirm(`「${u}」は${monthLabel(sm)}ごろに習う単元です。\n先取り学習に挑戦しますか？`)) return;
  }
  const ids = BANK.map((q,i)=>[q,i]).filter(([q])=>q.s===s&&q.u===u).map(([,i])=>i);
  // 未学習・低ステージ優先で出題
  ids.sort((a,b)=>{
    const sa=S.items[a]?S.items[a].stage:-1, sb=S.items[b]?S.items[b].stage:-1;
    return sa-sb || Math.random()-0.5;
  });
  startSession(shuffle(ids.slice(0,PRACTICE_SIZE)), `${SUBJECTS[s].name}・${u} 特訓`);
};

/* ---- クエスト開始 ---- */
window.startQuest = ()=>{
  const due = shuffle(dueIds()).slice(0, QUEST_SIZE);
  let queue = due.slice();
  if(queue.length < QUEST_SIZE){
    // 教科がかたよらないよう新規問題をラウンドロビンで補充（習った単元のみ）
    const fresh = newUnlockedIds();
    const bySub = {};
    shuffle(fresh).forEach(i=>{ (bySub[BANK[i].s]=bySub[BANK[i].s]||[]).push(i); });
    const subs = shuffle(Object.keys(bySub));
    let k=0;
    while(queue.length < QUEST_SIZE && subs.some(s=>bySub[s].length)){
      const s = subs[k++ % subs.length];
      if(bySub[s].length) queue.push(bySub[s].pop());
    }
  }
  if(!queue.length){ alert("いま習っている範囲の問題はぜんぶクリア済み！\nまた明日きてね🌙（「特訓」タブから先取り学習もできます）"); return; }
  startSession(interleave(queue), "今日のクエスト");
};

/* ---- セッション（出題エンジン） ---- */
let sess = null;
function startSession(ids, title){
  if(!ids.length){ go("home"); return; }
  sess = {
    title, queue:ids.slice(), total:ids.length,
    wrongOnce:new Set(), cleared:new Set(),
    firstTryCorrect:0, gainedXp:0, reviewCount:ids.filter(i=>S.items[i]).length,
    answeredThisQ:false,
  };
  nextQuestion();
}
function nextQuestion(){
  if(!sess.queue.length){ finishSession(); return; }
  const id = sess.queue[0];
  const q = BANK[id];
  const sub = SUBJECTS[q.s];
  // 選択肢シャッフル（c[0]が正解）
  const order = shuffle([0,1,2,3]);
  sess.currentOrder = order;
  sess.answeredThisQ = false;

  const pct = Math.round(sess.cleared.size / sess.total * 100);
  app.innerHTML = `
    <div class="row">
      <button class="btn-ghost" onclick="quitSession()">✕ やめる</button>
      <div class="grow"></div>
      <span class="pill">${esc(sess.title)}</span>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="sub center">${sess.cleared.size} / ${sess.total} クリア ${sess.wrongOnce.has(id)?"（リベンジ問題！）":""}</div>
    <div class="card" style="margin-top:12px">
      <div class="row">
        <span class="pill" style="border-color:${sub.color};color:${sub.color}">${sub.emoji} ${sub.name}｜${esc(q.u)}</span>
        <div class="grow"></div>
        ${S.items[id]?'<span class="duechip">🔁 復習</span>':'<span class="duechip">✨ 新問題</span>'}
      </div>
      <div class="qtext">${esc(q.q)}</div>
      <div id="choices">
        ${order.map((ci,pos)=>`<button class="choice" id="ch${pos}" onclick="answer(${pos})">${"❶❷❸❹"[pos]} ${esc(q.c[ci])}</button>`).join("")}
      </div>
      <div id="fb"></div>
    </div>
    <div class="sub center">キーボードの 1〜4 でも答えられます</div>`;
}
window.quitSession = ()=>{ if(confirm("クエストを中断しますか？（ここまでの記録は保存済み）")) go("home"); };

window.answer = (pos)=>{
  if(!sess || sess.answeredThisQ) return;
  sess.answeredThisQ = true;
  const id = sess.queue.shift();
  const q = BANK[id];
  const chosen = sess.currentOrder[pos];
  const correct = (chosen === 0);
  const correctPos = sess.currentOrder.indexOf(0);
  const wasWrongBefore = sess.wrongOnce.has(id);
  const wasReview = !!S.items[id];

  // ボタンの見た目更新
  for(let p=0;p<4;p++){
    const el = document.getElementById("ch"+p);
    el.disabled = true;
    if(p===correctPos) el.classList.add("correct");
    else if(p===pos) el.classList.add("wrong");
    else el.classList.add("dim");
  }

  let fbHtml;
  if(correct){
    soundOK();
    const xp = wasWrongBefore ? 5 : 10;
    S.xp += xp; sess.gainedXp += xp;
    S.answered++; S.correct++;
    if(!wasWrongBefore) sess.firstTryCorrect++;
    if(wasReview && !wasWrongBefore) S.reviewDone++;
    sess.cleared.add(id);
    scheduleAnswer(id, !wasWrongBefore, wasWrongBefore);
    const st = S.items[id];
    const days = INTERVALS[st.stage];
    fbHtml = `<div class="feedback ok"><b>⭕ 正解！ +${xp} XP</b><br>${esc(q.e)}<br>
      <span class="sub">📅 次の復習：${days===0?"今日中":days+"日後"}（思い出す間隔を少しずつ広げると記憶が長持ちします）</span></div>
      <button class="btn-main" onclick="nextQuestion()">次へ ▶</button>`;
  }else{
    soundNG();
    S.answered++;
    sess.wrongOnce.add(id);
    sess.queue.push(id); // セッションの最後に再挑戦（正解するまで終わらない）
    scheduleAnswer(id, false, false);
    fbHtml = `<div class="feedback ng"><b>❌ ざんねん…正解は「${esc(q.c[0])}」</b><br>${esc(q.e)}<br>
      <span class="sub">🔁 この問題はクエストの最後にもう一度出ます。自力で思い出せたら記憶に残ります！</span></div>
      <button class="btn-main" onclick="nextQuestion()">次へ ▶</button>`;
  }
  save();
  const fbEl = document.getElementById("fb");
  fbEl.innerHTML = fbHtml;
  ensureNextVisible();
};

/* 「次へ」ボタンが固定ナビの裏や画面外に隠れないよう、必要なぶんだけスクロールする。
   scrollIntoViewは「ほぼ表示済み」と判断すると動かないため、ナビの高さを引いて自前で計算する。 */
function ensureNextVisible(){
  const fbEl = document.getElementById("fb");
  const btn = fbEl && fbEl.querySelector("button");
  if(!btn) return;
  const navH = (document.querySelector("nav")||{}).offsetHeight || 74;
  const gap = 16;
  // innerHTML設定直後で同期的にレイアウトが取れるため、rAFを使わず即時にスクロールする
  // （rAFはタブ非表示時に発火しないことがあり、smoothスクロールも一部環境で不発のため使わない）
  const bottom = btn.getBoundingClientRect().bottom;        // ビューポート上端からの位置
  const limit = window.innerHeight - navH - gap;            // ナビより上に確保したい下端
  const overflow = bottom - limit;
  if(overflow > 0) window.scrollBy(0, overflow);
}

document.addEventListener("keydown",(ev)=>{
  if(btl){
    if(ev.key>="1" && ev.key<="4" && !btl.answeredThisQ){
      window.answerBattle(Number(ev.key)-1);
    }else if(ev.key==="Enter" && btl.answeredThisQ){
      ev.preventDefault(); // フォーカス中の古いボタンへのclick発火を防ぐ（進行不能・二重回答対策）
      window.btlNext();
    }
    return;
  }
  if(!sess) return;
  if(ev.key>="1" && ev.key<="4" && !sess.answeredThisQ){
    const el = document.getElementById("ch"+(Number(ev.key)-1));
    if(el) window.answer(Number(ev.key)-1);
  }else if(ev.key==="Enter" && sess.answeredThisQ){
    ev.preventDefault(); // フォーカス中の古いボタンへのclick発火を防ぐ（進行不能・二重回答対策）
    nextQuestion();
  }
});
window.nextQuestion = nextQuestion;

function finishSession(){
  const perfect = sess.wrongOnce.size===0;
  S.sessions++;
  if(perfect) S.perfectRuns++;

  updateStreak();
  const newBadges = checkNewBadges();
  save();

  const lvBefore = levelInfo(S.xp - sess.gainedXp).lvl;
  const lv = levelInfo(S.xp);
  const leveledUp = lv.lvl > lvBefore;
  if(leveledUp || newBadges.length) soundLv();

  const acc = Math.round(sess.firstTryCorrect/sess.total*100);
  const dueTomorrow = Object.values(S.items).filter(st=>st.due>Date.now() && st.due<=Date.now()+DAY).length;

  const doneSess = sess; sess = null;
  app.innerHTML = `
    <div class="card center">
      <div class="result-emoji">${perfect?"🏆":acc>=70?"🎉":"💪"}</div>
      <h1>${perfect?"パーフェクトクリア！":"クエストクリア！"}</h1>
      <div class="stat3">
        <div><div class="v" style="color:var(--gold)">+${doneSess.gainedXp}</div><div class="k">獲得XP</div></div>
        <div><div class="v">${acc}%</div><div class="k">一発正解率</div></div>
        <div><div class="v">🔥${S.streak}</div><div class="k">連続日数</div></div>
      </div>
      ${leveledUp?`<div class="feedback ok" style="margin-bottom:10px"><b>🎊 レベルアップ！ Lv.${lv.lvl} ${lv.title} になった！</b></div>`:""}
      ${newBadges.map(b=>`<div class="feedback ok" style="margin-bottom:10px"><b>${b.emoji} バッジ獲得「${b.name}」</b><br><span class="sub">${b.desc}</span></div>`).join("")}
      <div class="sub" style="margin:8px 0 4px">明日の復習予定：${dueTomorrow}問<br>寝ている間に記憶は整理されます。また明日つづきをやろう！</div>
      <button class="btn-main" onclick="go('home')">ホームへもどる</button>

  nav("home");
}

function battleQueue(){
  // 出題対象は習った単元のみ。復習期限が来ている問題を優先的に混ぜる
  const due = shuffle(dueIds().filter(i=>unitUnlocked(BANK[i].s,BANK[i].u)));
  const rest = shuffle(BANK.map((_,i)=>i).filter(i=>unitUnlocked(BANK[i].s,BANK[i].u) && !due.includes(i)));
  return interleave(due.slice(0,15).concat(rest.slice(0,25)));
}

window.answerBattle = (pos)=>{
  if(!btl || btl.answeredThisQ) return;
  btl.answeredThisQ = true;
  const id = btl.queue.shift();
  const q = BANK[id];
  const m = btl.m;
  const chosen = btl.currentOrder[pos];
  const correct = (chosen === 0);
  const correctPos = btl.currentOrder.indexOf(0);
  const wasReview = !!S.items[id];

  for(let p=0;p<4;p++){
    const el = document.getElementById("ch"+p);
    el.disabled = true;
    if(p===correctPos) el.classList.add("correct");
    else if(p===pos) el.classList.add("wrong");
    else el.classList.add("dim");
  }

  S.answered++;
  let fbHtml;
  if(correct){
    S.correct++;
    if(wasReview) S.reviewDone++;
    scheduleAnswer(id, true, false);
    btl.combo = Math.min(btl.combo+1, 999); // コンボは最大999回まで
    if(btl.combo > S.battle.maxCombo) S.battle.maxCombo = btl.combo;
    const msgs = [];
    let dmg = 10 + Math.min(btl.combo-1, 3)*2;         // コンボで最大+6
    if(btl.combo>=2) msgs.push(`⚡${btl.combo}コンボ！`);
    if(m.weak===q.s){ dmg*=2; msgs.push("こうかは ばつぐんだ！"); }
    if(Math.random()<0.15){ dmg=Math.round(dmg*1.5); msgs.push("きゅうしょに あたった！"); }
    btl.ehp = Math.max(0, btl.ehp - dmg);
    S.xp += 10; btl.gainedXp += 10;
    soundAtk();
    const mob = document.getElementById("mob");
    mob.classList.add("hit");
    if(btl.ehp<=0) mob.classList.add("fainted");
    const bar = document.getElementById("ehp");
    bar.style.width = Math.round(btl.ehp/m.hp*100)+"%";
    bar.className = hpClass(btl.ehp,m.hp);
    document.getElementById("ehptxt").textContent = btl.ehp+"/"+m.hp;
    fbHtml = `<div class="feedback ok"><b>⭕ 正解！ ${m.name}に ${dmg}ダメージ！</b> ${msgs.join(" ")}<br>${esc(q.e)}</div>`;
  }else{
    scheduleAnswer(id, false, false);
    btl.combo = 0;
    const edmg = m.atk + Math.floor(Math.random()*3);
    btl.php = Math.max(0, btl.php - edmg);

  }else if(btl.php<=0){

    <div class="card sub">ここまでの記録：セッション${S.sessions}回／のべ${S.answered}問に挑戦／${S.correct}問正解</div>`;
}
